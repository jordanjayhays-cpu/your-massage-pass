<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centros socios · Massage Club</title>
<meta name="description" content="Para centros de masaje en Madrid: pasadnos los huecos que se os quedan libres y se los ofrecemos a gente que nos escribe en inglés. Gratis hasta el 30 de noviembre de 2026.">
<meta name="theme-color" content="#F1EBE2">
<meta name="color-scheme" content="light">
<meta property="og:title" content="¿A qué hora se os suele quedar una sala vacía?">
<meta property="og:description" content="Massage Club, para centros de masaje en Madrid. Gratis hasta el 30 de noviembre de 2026. Sin cuota ni contrato.">
<meta property="og:image" content="https://jglftdstrowwckwqmpue.supabase.co/storage/v1/object/public/branding/mc-avatar-cream.png">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://jglftdstrowwckwqmpue.supabase.co" crossorigin>
<!--
  socios.html (17 Oct): the partnership page Jordan sends to studios by email
  or WhatsApp. Its one job is to get a studio to give us the times it would
  like to offer to Massage Club clients, so the bot can send customers its way.

  Personal link: /socios?s=<partners.slug> greets the studio and prefills its
  details with a read-only select on the public partners table. A studio we
  already work with can go straight to its times (#horas).

  Saving: nothing is sent anywhere unless the page is opened with ?live=1.
  Then the save button POSTs {"ops":"studio_signup","payload":{...}} to
  wa-bot. Without it the page is a preview and says so on every step.
  No tracking, no external JS, nothing sent on page load.
-->
<style>
:root{
  --page:#F1EBE2; --ink:#262019; --muted:#8A7F73; --muted-ink:#62584E; --clay:#B85C38; --clay-ink:#9A4A2C;
  --cream:#FAF6F0; --line:#F0E9E0; --edge:#DCD0C0; --field:#9C9083; --white:#FFFFFF; --bad:#A3271C;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--sans);font-size:17px;line-height:1.5;color:var(--ink);background:var(--page);overflow-x:hidden;min-height:100vh}
body.docked{padding-bottom:92px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--clay-ink);text-underline-offset:3px}
img{display:block;max-width:100%}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--clay-ink);outline-offset:3px;border-radius:8px}
.skiplink{position:absolute;left:16px;top:-60px;background:var(--ink);color:var(--cream);padding:12px 16px;border-radius:10px;z-index:20;text-decoration:none;font-weight:700}
.skiplink:focus{top:12px}

.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:4px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:1;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 1px var(--edge)}
.brand span{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.lang{min-width:48px;height:44px;padding:0 14px;border-radius:999px;background:var(--cream);border:1.5px solid var(--edge);font-size:15px;font-weight:700}
.lang:hover{border-color:var(--field)}

/* Landing */
.hero{padding:22px 0 8px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--clay-ink)}
.hello{font-family:var(--serif);font-size:20px;color:var(--clay-ink);margin-top:14px}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.015em;color:var(--ink)}
h1{font-size:clamp(31px,8.6vw,46px);line-height:1.08;margin-top:10px}
h2{font-size:clamp(26px,7vw,32px);line-height:1.12}
h3{font-size:21px;line-height:1.2}
.lead{font-size:18px;line-height:1.5;margin-top:14px;color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:14px 20px;border-radius:16px;font-size:18px;font-weight:700;text-align:center;text-decoration:none;transition:transform .1s,background-color .15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--clay);color:var(--white);box-shadow:0 10px 24px rgba(184,92,56,.28)}
.btn-primary:hover{background:var(--clay-ink)}
.btn-secondary{background:var(--cream);color:var(--ink);border:1.5px solid var(--field);font-size:16.5px;min-height:52px}
.btn-text{min-height:48px;padding:10px 4px;font-size:16px;font-weight:700;color:var(--clay-ink);text-decoration:underline;text-underline-offset:3px;width:auto}
.btn[disabled]{opacity:.6;cursor:progress}
.ctas{display:grid;gap:10px;margin-top:22px}
.note{font-size:15px;color:var(--muted-ink);text-align:center}
.proof{margin-top:22px;padding:14px 16px;border-left:3px solid var(--clay);background:var(--cream);border-radius:0 14px 14px 0;font-size:16px;color:var(--ink)}

.sec{margin-top:36px}
.sec > h2{margin-bottom:14px}
.benefits{list-style:none;display:grid;gap:10px}
.benefits li{display:flex;gap:12px;align-items:flex-start;background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16px}
.tick{flex:none;width:26px;height:26px;border-radius:50%;background:var(--clay);color:var(--white);display:grid;place-items:center;font-size:15px;font-weight:700;margin-top:1px}
.benefits b{display:block;font-size:17px}
.steps{list-style:none;counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;font-size:16.5px}
.steps li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--clay);color:var(--clay-ink);font-family:var(--serif);font-weight:700;font-size:18px;display:grid;place-items:center;background:var(--cream)}

.terms{background:var(--cream);border:2px solid var(--clay);border-radius:20px;padding:20px 18px}
.terms h2{font-size:clamp(22px,6.2vw,27px)}
.terms ul{list-style:none;margin-top:14px;display:grid;gap:0}
.terms li{padding:11px 0;border-top:1px solid var(--line);font-size:16.5px}
.terms li:first-child{border-top:0}
.terms li.cmp{font-size:15px;color:var(--muted-ink);border-top:1px dashed var(--edge);margin-top:4px;padding-top:14px}

.faq{display:grid;gap:8px}
.faq details{background:var(--cream);border:1px solid var(--line);border-radius:14px}
.faq summary{list-style:none;cursor:pointer;min-height:52px;padding:13px 48px 13px 16px;font-weight:700;font-size:16.5px;position:relative;border-radius:14px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:24px;font-weight:400;color:var(--clay-ink)}
.faq details[open] summary::after{content:"\2212"}
.faq details p{padding:0 16px 16px;font-size:16px}

.contact{margin:36px 0 28px;padding-top:20px;border-top:1px solid var(--edge);font-size:16px}
.contact b{font-family:var(--serif);font-size:18px}
.contact a{word-break:break-word}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(241,235,226,.96);border-top:1px solid var(--edge);padding:12px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dock .btn{max-width:568px;margin:0 auto}

/* Flow */
.flow{padding:8px 0 40px}
.preview{display:inline-block;font-size:13.5px;color:var(--muted-ink);background:var(--cream);border:1px dashed var(--field);border-radius:999px;padding:5px 12px;margin:6px 0 10px}
.progress{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 22px}
.progress li{font-size:13.5px;font-weight:700;color:var(--muted-ink)}
.progress li::before{content:"";display:block;height:6px;border-radius:6px;background:var(--edge);margin-bottom:7px}
.progress li.done::before,.progress li[aria-current="step"]::before{background:var(--clay)}
.progress li[aria-current="step"]{color:var(--ink)}
.step h2{outline:none}
.step .sub{margin-top:8px;font-size:16.5px;color:var(--ink)}
.step .hello{margin-top:0;margin-bottom:6px}

.field{margin-top:18px}
.field label,.field .lbl{display:block;font-size:16px;font-weight:700;margin-bottom:6px}
.opt{font-weight:400;color:var(--muted-ink)}
.field input[type=text],.field input[type=tel],.field input[type=email]{width:100%;min-height:52px;background:var(--white);border:1.5px solid var(--field);border-radius:14px;padding:12px 14px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus{border-color:var(--clay-ink);box-shadow:0 0 0 3px rgba(184,92,56,.22)}
.field input[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 2px rgba(163,39,28,.15)}
.hint{font-size:14.5px;color:var(--muted-ink);margin-top:6px}
.err{font-size:15px;color:var(--bad);font-weight:700;margin-top:6px}
.err:empty{display:none}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.euro{position:relative}
.euro input{padding-right:36px !important}
.euro::after{content:"\20AC";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted-ink);font-weight:700;pointer-events:none}
.sublbl{display:block;font-size:14.5px;color:var(--muted-ink);margin-bottom:4px;font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:22px;padding:14px;background:var(--cream);border:1.5px solid var(--edge);border-radius:14px}
.check.bad{border-color:var(--bad)}
.check input{flex:none;width:26px;height:26px;margin-top:1px;accent-color:var(--clay)}
.check label{font-weight:700;font-size:17px;cursor:pointer}
.check .line{display:block;font-weight:400;font-size:14.5px;color:var(--muted-ink);margin-top:4px}
.actions{display:grid;gap:6px;margin-top:22px;justify-items:center}

.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:15px;color:var(--muted-ink)}
.who b{color:var(--ink)}
.who .btn-text{min-height:40px;padding:6px 2px;font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:0}
.seg legend{font-size:16px;font-weight:700;margin-bottom:8px;padding:0}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;border:1.5px solid var(--field);background:var(--white);font-weight:700;font-size:17px}
.seg input:checked + span{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.seg input:focus-visible + span{outline:3px solid var(--clay-ink);outline-offset:3px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{position:relative;min-height:62px;border-radius:14px;border:1.5px solid var(--field);background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;line-height:1.2}
.day .dt{font-weight:700;font-size:15.5px}
.day .dd{font-size:13.5px;color:var(--muted-ink)}
.day[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.day[aria-pressed=true] .dd{color:#E9DFD2}
.badge{position:absolute;top:-7px;right:-5px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--clay);color:var(--white);font-size:13px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--page)}
.dayinfo{font-size:15px;color:var(--muted-ink);margin-top:14px}
.glabel{font-size:13.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-ink);margin:16px 0 8px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tm{min-height:50px;border-radius:12px;border:1.5px solid var(--field);background:var(--white);font-weight:700;font-size:16.5px;font-variant-numeric:tabular-nums}
.tm[aria-pressed=true]{background:var(--clay);border-color:var(--clay);color:var(--white)}
.tm[aria-pressed=true]::before{content:"\2713";margin-right:4px}
.empty{margin-top:14px;padding:14px;border-radius:14px;background:var(--cream);font-size:16px}
.switch{display:flex;align-items:center;gap:14px;justify-content:space-between;margin-top:22px;padding:12px 14px;background:var(--cream);border:1.5px solid var(--edge);border-radius:14px}
.switch label{font-weight:700;font-size:17px;cursor:pointer}
.switch .hint{margin-top:2px}
.switch input{-webkit-appearance:none;appearance:none;flex:none;width:56px;height:32px;border-radius:16px;background:var(--field);position:relative;cursor:pointer;transition:background-color .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--white);transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked{background:var(--clay)}
.switch input:checked::after{transform:translateX(24px)}
.summary{margin-top:18px;padding:16px;border-radius:16px;background:var(--white);border:1.5px solid var(--edge)}
.summary .sumhead{font-weight:700}
.summary ul{list-style:none;margin-top:8px;display:grid;gap:6px;font-size:16px}
.summary li b{margin-right:6px}

.done-mark{width:64px;height:64px;border-radius:50%;background:var(--clay);color:var(--white);display:grid;place-items:center;font-size:32px;margin-bottom:16px}
.next{list-style:none;display:grid;gap:10px;margin-top:16px}
.next li{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16.5px}

@media (min-width:720px){
  .wrap{padding:0 24px}
  .hero{padding-top:40px}
  .ctas{grid-template-columns:1fr;max-width:420px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<a class="skiplink" href="#main" data-t="skip">Saltar al contenido</a>

<div class="wrap">
  <header class="top">
    <a class="brand" href="/socios" id="home">
      <img src="https://jglftdstrowwckwqmpue.supabase.co/storage/v1/object/public/branding/mc-avatar-cream.png" width="40" height="40" alt="" decoding="async">
      <span>Massage Club</span>
    </a>
    <button type="button" class="lang" id="lang" lang="en" aria-label="Read this page in English">EN</button>
  </header>

  <main id="main" tabindex="-1">

    <!-- A. Landing -->
    <div id="landing">
      <section class="hero" aria-labelledby="h1">
        <p class="kicker" data-t="kicker"></p>
        <p class="hello" id="helloTop" hidden></p>
        <h1 id="h1" data-t="h1"></h1>
        <p class="lead" data-t="sub"></p>
        <div class="ctas">
          <button type="button" class="btn btn-primary" id="heroCta" data-go="1" data-t="cta"></button>
          <button type="button" class="btn btn-secondary" id="knownCta" data-go="2" data-t="ctaKnown" hidden></button>
          <p class="note" data-t="ctaNote"></p>
        </div>
        <p class="proof" data-t="proof"></p>
      </section>

      <section class="sec" aria-labelledby="hWhy">
        <h2 id="hWhy" data-t="whyTitle"></h2>
        <ul class="benefits">
          <li><span class="tick" aria-hidden="true">&#10003;</span><span data-h="b1"></span></li>
          <li><span class="tick" aria-hidden="true">&#10003;</span><span data-h="b2"></span></li>
          <li><span class="tick" aria-hidden="true">&#10003;</span><span data-h="b3"></span></li>
          <li><span class="tick" aria-hidden="true">&#10003;</span><span data-h="b4"></span></li>
          <li><span class="tick" aria-hidden="true">&#10003;</span><span data-h="b5"></span></li>
        </ul>
      </section>

      <section class="sec" aria-labelledby="hHow">
        <h2 id="hHow" data-t="howTitle"></h2>
        <ol class="steps">
          <li data-t="how1"></li>
          <li data-t="how2"></li>
          <li data-t="how3"></li>
          <li data-t="how4"></li>
        </ol>
      </section>

      <section class="sec terms" id="terms" aria-labelledby="hTerms">
        <h2 id="hTerms" data-t="termsTitle"></h2>
        <ul>
          <li data-h="t1"></li>
          <li data-h="t2"></li>
          <li data-h="t3"></li>
          <li data-t="t4"></li>
          <li class="cmp" data-t="t5"></li>
        </ul>
      </section>

      <div class="ctas" style="margin-top:24px">
        <button type="button" class="btn btn-primary" id="finalCta" data-go="1" data-t="cta"></button>
      </div>

      <section class="sec" aria-labelledby="hFaq">
        <h2 id="hFaq" data-t="faqTitle"></h2>
        <div class="faq">
          <details><summary data-t="q1"></summary><p data-t="a1"></p></details>
          <details><summary data-t="q2"></summary><p data-t="a2"></p></details>
          <details><summary data-t="q3"></summary><p data-t="a3"></p></details>
          <details><summary data-t="q4"></summary><p data-t="a4"></p></details>
          <details><summary data-t="q5"></summary><p data-t="a5"></p></details>
        </div>
      </section>
    </div>

    <!-- B to D. The three steps -->
    <div id="flow" class="flow" hidden>
      <p class="preview" id="previewNote" data-t="preview" hidden></p>
      <ol class="progress" id="progress" data-aria="progressAria">
        <li data-n="1"><span class="sr" data-t="stepWord1"></span><span data-t="p1"></span></li>
        <li data-n="2"><span class="sr" data-t="stepWord2"></span><span data-t="p2"></span></li>
        <li data-n="3"><span class="sr" data-t="stepWord3"></span><span data-t="p3"></span></li>
      </ol>

      <!-- B. Step 1: details -->
      <section class="step" data-step="1" aria-labelledby="s1h" hidden>
        <p class="hello" id="helloStep" hidden></p>
        <h2 id="s1h" tabindex="-1" data-t="s1Title"></h2>
        <p class="sub" id="s1sub"></p>
        <form id="f1" novalidate>
          <div class="field">
            <label for="name" data-t="fName"></label>
            <input type="text" id="name" name="name" autocomplete="organization" autocapitalize="words" required aria-describedby="nameErr">
            <p class="err" id="nameErr" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="wa" data-t="fWa"></label>
            <input type="tel" id="wa" name="wa" autocomplete="tel" inputmode="tel" placeholder="+34 600 000 000" required aria-describedby="waHint waErr">
            <p class="hint" id="waHint" data-t="fWaHint"></p>
            <p class="err" id="waErr" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="addr" data-t="fAddr"></label>
            <input type="text" id="addr" name="addr" autocomplete="street-address" data-ph="fAddrPh" required aria-describedby="addrErr">
            <p class="err" id="addrErr" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="email"><span data-t="fEmail"></span> <span class="opt" data-t="opt"></span></label>
            <input type="email" id="email" name="email" autocomplete="email" inputmode="email" placeholder="hola@vuestrocentro.es" aria-describedby="emailErr">
            <p class="err" id="emailErr" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="hours"><span data-t="fHours"></span> <span class="opt" data-t="opt"></span></label>
            <input type="text" id="hours" name="hours" data-ph="fHoursPh" aria-describedby="hoursHint">
            <p class="hint" id="hoursHint"></p>
          </div>
          <div class="field" role="group" aria-labelledby="priceLbl">
            <span class="lbl" id="priceLbl"><span data-t="fPrices"></span> <span class="opt" data-t="opt"></span></span>
            <div class="prices">
              <div>
                <label class="sublbl" for="p60">60 min</label>
                <div class="euro"><input type="text" id="p60" inputmode="decimal" autocomplete="off" aria-describedby="priceHint priceErr"></div>
              </div>
              <div>
                <label class="sublbl" for="p90">90 min</label>
                <div class="euro"><input type="text" id="p90" inputmode="decimal" autocomplete="off" aria-describedby="priceHint priceErr"></div>
              </div>
            </div>
            <p class="hint" id="priceHint"></p>
            <p class="err" id="priceErr" aria-live="polite"></p>
          </div>
          <div class="check" id="acceptBox">
            <input type="checkbox" id="accept" required aria-describedby="acceptLine acceptErr">
            <div>
              <label for="accept" data-t="accept"></label>
              <span class="line" id="acceptLine" data-t="termsLine"></span>
            </div>
          </div>
          <p class="err" id="acceptErr" aria-live="polite"></p>
          <div class="actions">
            <button type="submit" class="btn btn-primary" data-t="next1"></button>
            <button type="button" class="btn btn-text" data-go="0" data-t="back0"></button>
          </div>
        </form>
      </section>

      <!-- C. Step 2: times -->
      <section class="step" data-step="2" aria-labelledby="s2h" hidden>

const DAY_IDX = { sun: 0, dom: 0, mon: 1, lun: 1, tue: 2, mar: 2, wed: 3, mie: 3, thu: 4, jue: 4, fri: 5, vie: 5, sat: 6, sab: 6 };
const stripAccents = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
function parseHours(text) {
  const raw = stripAccents(String(text || "").toLowerCase()).trim();
  if (!raw) return null;
  const out = new Map();
  const toMin = (h) => { const [a, b] = h.split(/[:.]/); return parseInt(a, 10) * 60 + (parseInt(b || "0", 10) || 0); };
  for (const seg0 of raw.split(/[,;]|\s+y\s+|\s+and\s+/)) {
    const seg = seg0.trim();
    if (!seg) continue;
    const m = seg.match(/^(.*?)\s*(\d{1,2}(?:[:.]\d{2})?)\s*(?:-|\u2013|a)\s*(\d{1,2}(?:[:.]\d{2})?)\s*h?$/);
    if (!m) return null;
    const dayPart = m[1].trim().replace(/:$/, "");
    const open = toMin(m[2]), close = toMin(m[3]);
    if (!(close > open)) return null;
    const days = [];
    if (dayPart === "" || /^(daily|todos los dias|every day|diario|cada dia)$/.test(dayPart)) days.push(0, 1, 2, 3, 4, 5, 6);
    else {
      for (const tok of dayPart.split(/\s*\/\s*|\s+/)) {
        const range = tok.match(/^([a-z]{3})[a-z]*\.?\s*(?:-|\u2013)\s*([a-z]{3})[a-z]*\.?$/);
        if (range) {
          const a = DAY_IDX[range[1]], b = DAY_IDX[range[2]];
          if (a === undefined || b === undefined) return null;
          for (let d = a; ; d = (d + 1) % 7) { days.push(d); if (d === b) break; }
        } else {
          const one = tok.match(/^([a-z]{3})[a-z]*\.?$/);
          if (!one || DAY_IDX[one[1]] === undefined) return null;
          days.push(DAY_IDX[one[1]]);
        }
      }
    }
    for (const d of days) out.set(d, [open, close]);
  }
  return out.size ? out : null;
}
let HOURS = null;
const DEFAULT_HOURS = [9 * 60, 21 * 60];
const hoursFor = (wd) => (HOURS ? HOURS.get(wd) || null : DEFAULT_HOURS);

function mkDay(i) {
  const n = madridNow();
  const dt = new Date(Date.UTC(n.y, n.m - 1, n.d) + i * 864e5);
  return { iso: dt.toISOString().slice(0, 10), wd: dt.getUTCDay(), offset: i, dt };
}
function startsFor(d) {
  const h = hoursFor(d.wd);
  if (!h) return [];
  let first = Math.ceil(h[0] / 30) * 30;
  if (d.offset === 0) first = Math.max(first, Math.ceil((madridNow().min + LEAD_MIN) / 30) * 30);
  const out = [];
  for (let m = first; m + S.dur <= h[1]; m += 30) out.push(m);
  return out;
}
// The next seven days in Madrid, today first. Today drops out once no massage
// fits before closing; closed days never show when the hours are known.
function dayList() {
  const startAt = startsFor(mkDay(0)).length ? 0 : 1;
  const out = [];
  for (let i = startAt; i < startAt + 7; i++) { const d = mkDay(i); if (hoursFor(d.wd)) out.push(d); }
  return out;
}
function prune() {
  const days = dayList();
  let dropped = 0;
  for (const iso of Object.keys(S.sel)) {
    const d = days.find((x) => x.iso === iso);
    const ok = new Set(d ? startsFor(d) : []);
    for (const m of Array.from(S.sel[iso])) if (!ok.has(m)) { S.sel[iso].delete(m); dropped++; }
    if (!S.sel[iso].size) delete S.sel[iso];
  }
  return dropped;
}
function selList() {
  return dayList().filter((d) => S.sel[d.iso] && S.sel[d.iso].size).map((d) => ({ d, mins: Array.from(S.sel[d.iso]).sort((a, b) => a - b) }));
}

// ---------------------------------------------------------------- phone
// Stored like every other number: "+<country><number>". A Spanish number typed
// without a prefix ("660 390 910") is +34.
function intl(v) {
  let d = String(v || "").replace(/[^0-9+]/g, "");
  if (!d) return "";
  if (d.startsWith("00")) d = "+" + d.slice(2);
  if (d.startsWith("+")) return "+" + d.slice(1).replace(/\D/g, "");
  return /^[6789]\d{8}$/.test(d) ? "+34" + d : "+" + d;
}
function pretty(v) {
  const p = intl(v);
  const m = p.match(/^\+34(\d{3})(\d{3})(\d{3})$/);
  return m ? `+34 ${m[1]} ${m[2]} ${m[3]}` : p;
}
const priceNum = (v) => {
  const s = String(v || "").replace(/[€\s]/g, "").replace(",", ".");
  if (!s) return null;
  const n = Number(s);
  return Number.isFinite(n) && n > 0 && n < 1000 ? Math.round(n * 100) / 100 : NaN;
};

// ---------------------------------------------------------------- painting
function paintStatic() {
  document.documentElement.lang = L;
  document.title = t("docTitle");
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-h]").forEach((el) => { el.innerHTML = t(el.dataset.h); });
  document.querySelectorAll("[data-ph]").forEach((el) => { el.placeholder = t(el.dataset.ph); });
  document.querySelectorAll("[data-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.aria)); });
  const lb = $("lang");
  lb.textContent = t("langBtn");
  lb.setAttribute("aria-label", t("langAria"));
  lb.setAttribute("lang", L === "es" ? "en" : "es");
  $("hours").placeholder = t("fHoursPh");
  paintDynamic();
}
function paintDynamic() {
  const name = S.partner ? S.partner.business_name : "";
  ["helloTop", "helloStep"].forEach((id) => { $(id).hidden = !name; $(id).textContent = name ? t("hello", { n: name }) : ""; });
  $("knownCta").hidden = !S.partner;
  $("s1sub").textContent = S.partner ? t("s1SubKnown") : t("s1SubNew");
  $("previewNote").hidden = LIVE;
  $("priceHint").textContent = t("priceHint") + (S.partner && S.partner.price_from ? " " + t("priceFrom", { p: String(Number(S.partner.price_from)).replace(".", L === "es" ? "," : ".") }) : "");
  paintHoursHint();
  paintWho();
  $("accept2Box").hidden = S.accepted;
  if (S.step === 2) renderTimes();
  if (S.step === 3) renderDone();
  // Errors already on screen follow the language.
  document.querySelectorAll(".err[data-k]").forEach((el) => { if (el.textContent) el.textContent = t(el.dataset.k, { d: S.dur }); });
}
function paintHoursHint() {
  const raw = val("hours");
  const el = $("hoursHint");
  if (!raw) { el.textContent = t("hoursHintNone"); return; }
  const h = parseHours(raw);
  if (!h) { el.textContent = t("hoursHintBad"); return; }
  // Read it back so the studio can see we understood it: "lun-vie, de 10:00 a
  // 20:00; sáb, de 10:00 a 14:00". Neighbouring days with the same hours join.
  const order = [1, 2, 3, 4, 5, 6, 0];
  const wd = (d) => new Intl.DateTimeFormat(locale(), { timeZone: "UTC", weekday: "short" }).format(new Date(Date.UTC(2026, 9, 4 + d))).replace(/\./g, ""); // 4 Oct 2026 is a Sunday
  const groups = [];
  for (const d of order) {
    if (!h.has(d)) continue;
    const [o, c] = h.get(d);
    const g = groups[groups.length - 1];
    if (g && g.o === o && g.c === c && order.indexOf(g.last) + 1 === order.indexOf(d)) g.last = d;
    else groups.push({ first: d, last: d, o, c });
  }
  const span = (o, c) => L === "es" ? `de ${hhmm(o)} a ${hhmm(c)}` : `${hhmm(o)} to ${hhmm(c)}`;
  const names = groups.length === 1 && h.size === 7
    ? [(L === "es" ? "todos los días, " : "every day, ") + span(groups[0].o, groups[0].c)]
    : groups.map((g) => (g.first === g.last ? wd(g.first) : wd(g.first) + "-" + wd(g.last)) + ", " + span(g.o, g.c));
  el.textContent = t("hoursHintOk", { h: names.join("; ") });
}
function paintWho() {
  const name = val("name"), wa = val("wa");
  $("who").hidden = !name;
  $("whoText").innerHTML = name ? `<b>${esc(name)}</b>${wa ? " · " + esc(pretty(wa)) : ""}` : "";
}

function renderTimes() {
  const days = dayList();
  if (!days.find((d) => d.iso === S.day)) S.day = days.length ? days[0].iso : null;
  $("days").innerHTML = days.map((d) => {
    const n = S.sel[d.iso] ? S.sel[d.iso].size : 0;
    const top = d.offset === 0 ? t("today") : d.offset === 1 ? t("tomorrow") : cap(fmt(d, { weekday: "short" }));
    const bottom = fmt(d, { day: "numeric", month: "short" });
    const badge = n ? `<span class="badge" aria-hidden="true">${n}</span><span class="sr">, ${esc(n === 1 ? t("nSel1") : t("nSel", { n }))}</span>` : "";
    return `<button type="button" class="day" data-iso="${d.iso}" aria-pressed="${d.iso === S.day}"><span class="dt">${esc(top)}</span><span class="dd">${esc(bottom)}</span>${badge}</button>`;
  }).join("");
  const d = days.find((x) => x.iso === S.day);
  if (!d) {
    $("dayInfo").textContent = "";
    $("grid").innerHTML = `<p class="empty">${esc(t("noDays"))}</p>`;
  } else {
    const h = hoursFor(d.wd);
    $("dayInfo").textContent = cap(fmt(d, { weekday: "long", day: "numeric", month: "long" })) + ". " + (HOURS ? t("openFromTo", { a: hhmm(h[0]), b: hhmm(h[1]) }) : t("unknownHours"));
    const starts = startsFor(d);
    const sel = S.sel[d.iso] || new Set();
    const btn = (m) => `<button type="button" class="tm" data-m="${m}" aria-pressed="${sel.has(m)}">${hhmm(m)}</button>`;
    const am = starts.filter((m) => m < 14 * 60), pm = starts.filter((m) => m >= 14 * 60);
    const group = (list, k) => list.length ? `<p class="glabel" aria-hidden="true">${esc(t(k))}</p><div class="times" role="group" aria-label="${esc(t(k + "Aria"))}">${list.map(btn).join("")}</div>` : "";
    $("grid").innerHTML = (group(am, "am") + group(pm, "pm")) || `<p class="empty">${esc(t("noTimes", { d: S.dur }))}</p>`;
  }
  renderSummary();
}
function summaryHTML(list, dur, repeat) {
  if (!list.length) return `<p>${esc(t("sumNone"))}</p>`;
  const n = list.reduce((a, x) => a + x.mins.length, 0);
  const head = (n === 1 ? t("sum1", { d: dur }) : t("sumN", { n, d: dur })) + " · " + t(repeat ? "weekly" : "once");
  const rows = list.map(({ d, mins }) => {
    const label = repeat ? t("every", { wd: fmt(d, { weekday: "long" }) }) : cap(fmt(d, { weekday: "short", day: "numeric", month: "short" }));
    return `<li><b>${esc(cap(label))}</b>${mins.map(hhmm).join(", ")}</li>`;
  }).join("");
  return `<p class="sumhead">${esc(head)}</p><ul>${rows}</ul>`;
}
function renderSummary() { $("summary").innerHTML = summaryHTML(selList(), S.dur, S.repeat); }
function renderDone() {
  const name = val("name");
  $("thanks").textContent = name ? t("thanksN", { n: name }) : t("thanks0");
  const last = S.sent[S.sent.length - 1];
  $("sentSummary").innerHTML = last ? summaryHTML(last.list, last.dur, last.repeat) : "";
  $("sentSummary").hidden = !last;
  $("sentPreview").hidden = LIVE || !last;
}

// ---------------------------------------------------------------- navigation
const HASH = { 0: "", 1: "#datos", 2: "#horas", 3: "#listo" };
const stepFromHash = () => ({ "#datos": 1, "#horas": 2, "#listo": 3 })[location.hash] || 0;
function go(step, push = true) {
  if (step === 3 && !S.sent.length) step = 2;
  S.step = step;
  $("landing").hidden = step !== 0;
  $("flow").hidden = step === 0;
  document.querySelectorAll(".step").forEach((el) => { el.hidden = Number(el.dataset.step) !== step; });
  document.querySelectorAll("#progress li").forEach((li) => {
    const n = Number(li.dataset.n);
    if (n === step) li.setAttribute("aria-current", "step"); else li.removeAttribute("aria-current");
    li.classList.toggle("done", n < step);
  });
  if (push) history.pushState({ step }, "", location.pathname + location.search + HASH[step]);
  if (step === 2) { prune(); paintWho(); renderTimes(); $("accept2Box").hidden = S.accepted; }
  if (step === 3) renderDone();
  updateDock();
  window.scrollTo(0, 0);
  const h = step === 0 ? null : $("s" + step + "h");
  if (h && push) h.focus({ preventScroll: true });
}
window.addEventListener("popstate", () => go(stepFromHash(), false));
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-go]");
  if (b) { e.preventDefault(); go(Number(b.dataset.go)); }
});
$("home").addEventListener("click", (e) => { e.preventDefault(); go(0); });
$("lang").addEventListener("click", () => { L = L === "es" ? "en" : "es"; paintStatic(); });

// The bottom bar only shows on the landing, once the top button is out of view
// and before the second one comes in.
const visible = new Set();
function updateDock() {
  const on = S.step === 0 && "IntersectionObserver" in window && !visible.has("heroCta") && !visible.has("finalCta") && seenScroll;
  $("dock").hidden = !on;
  document.body.classList.toggle("docked", on);
}
let seenScroll = false;
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver((entries) => {
    for (const en of entries) { if (en.isIntersecting) visible.add(en.target.id); else visible.delete(en.target.id); }
    updateDock();
  });
  io.observe($("heroCta")); io.observe($("finalCta"));
  window.addEventListener("scroll", () => { if (!seenScroll && window.scrollY > 40) { seenScroll = true; updateDock(); } }, { passive: true });
}

// ---------------------------------------------------------------- step 1
function setErr(inputId, errId, key) {
  const el = $(errId);
  el.dataset.k = key || "";
  el.textContent = key ? t(key) : "";
  if (inputId) $(inputId).setAttribute("aria-invalid", key ? "true" : "false");
}
function checkDetails() {
  const bad = [];
  setErr("name", "nameErr", val("name") ? "" : (bad.push("name"), "errName"));
  setErr("wa", "waErr", intl(val("wa")).replace(/\D/g, "").length >= 9 ? "" : (bad.push("wa"), "errWa"));
  setErr("addr", "addrErr", val("addr") ? "" : (bad.push("addr"), "errAddr"));
  const em = val("email");
  setErr("email", "emailErr", !em || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em) ? "" : (bad.push("email"), "errEmail"));
  const p60 = priceNum(val("p60")), p90 = priceNum(val("p90"));
  const pBad = Number.isNaN(p60) ? "p60" : Number.isNaN(p90) ? "p90" : "";
  setErr(null, "priceErr", pBad ? (bad.push(pBad), "errPrice") : "");
  $("p60").setAttribute("aria-invalid", Number.isNaN(p60) ? "true" : "false");
  $("p90").setAttribute("aria-invalid", Number.isNaN(p90) ? "true" : "false");
  return bad;
}
$("f1").addEventListener("submit", (e) => {
  e.preventDefault();
  const bad = checkDetails();
  S.accepted = $("accept").checked;
  setErr(null, "acceptErr", S.accepted ? "" : "errAccept");
  $("acceptBox").classList.toggle("bad", !S.accepted);
  if (!S.accepted) bad.push("accept");
  if (bad.length) { $(bad[0]).focus(); return; }
  go(2);
});
$("accept").addEventListener("change", () => {
  S.accepted = $("accept").checked; $("accept2").checked = S.accepted;
  if (S.accepted) { setErr(null, "acceptErr", ""); $("acceptBox").classList.remove("bad"); }
});
$("hours").addEventListener("input", () => { HOURS = parseHours(val("hours")); paintHoursHint(); });
["name", "wa"].forEach((id) => $(id).addEventListener("input", paintWho));

// ---------------------------------------------------------------- step 2
$("durSet").addEventListener("change", (e) => {
  if (e.target.name !== "dur") return;
  S.dur = Number(e.target.value);
  const n = prune();
  $("dropNote").textContent = n ? t(n === 1 ? "dropped1" : "droppedN", { n, d: S.dur }) : "";
  renderTimes();
});
$("days").addEventListener("click", (e) => {
  const b = e.target.closest("[data-iso]");
  if (!b) return;
  S.day = b.dataset.iso;
  renderTimes();
  const again = $("days").querySelector(`[data-iso="${S.day}"]`);
  if (again) again.focus();
});
$("grid").addEventListener("click", (e) => {
  const b = e.target.closest("[data-m]");
  if (!b || !S.day) return;
  const m = Number(b.dataset.m);
  const set = S.sel[S.day] || (S.sel[S.day] = new Set());
  if (set.has(m)) set.delete(m); else set.add(m);
  if (!set.size) delete S.sel[S.day];
  b.setAttribute("aria-pressed", String(!!(S.sel[S.day] && S.sel[S.day].has(m))));
  // Only the badge on the day changes; the grid keeps focus where it was.
  const chip = $("days").querySelector(`[data-iso="${S.day}"]`);
  if (chip) {
    const n = S.sel[S.day] ? S.sel[S.day].size : 0;
    chip.querySelectorAll(".badge,.sr").forEach((x) => x.remove());
    if (n) chip.insertAdjacentHTML("beforeend", `<span class="badge" aria-hidden="true">${n}</span><span class="sr">, ${esc(n === 1 ? t("nSel1") : t("nSel", { n }))}</span>`);
  }
  $("saveErr").textContent = "";
  renderSummary();
});
$("repeat").addEventListener("change", () => { S.repeat = $("repeat").checked; renderSummary(); });
$("accept2").addEventListener("change", () => {
  S.accepted = $("accept2").checked; $("accept").checked = S.accepted;
  if (S.accepted) { setErr(null, "accept2Err", ""); $("accept2Box").classList.remove("bad"); }
});

function buildPayload(list) {
  return {
    form: "socios",
    form_version: FORM_VERSION,
    lang: L,
    link_slug: SLUG_OK ? SLUG : null,
    partner_slug: S.partner ? S.partner.slug : null,
    studio: {
      business_name: val("name"),
      whatsapp: intl(val("wa")),
      address: val("addr"),
      email: val("email").toLowerCase() || null,
      opening_hours: val("hours") || null,
      price_60_eur: priceNum(val("p60")),
      price_90_eur: priceNum(val("p90")),
    },
    terms: {
      accepted: true,
      accepted_at: new Date().toISOString(),
      version: "2026-10-17",
      text: T[L].termsLine,
    },
    availability: {
      tz: "Europe/Madrid",
      duration_min: S.dur,
      repeat_weekly: S.repeat,
      slots: list.flatMap(({ d, mins }) => mins.map((m) => ({ date: d.iso, weekday: d.wd, start: hhmm(m), end: hhmm(m + S.dur) }))),
    },
  };
}

$("save").addEventListener("click", async () => {
  if (S.saving) return;
  $("saveErr").textContent = "";
  prune();
  const list = selList();
  if (!list.length) { renderTimes(); setErr(null, "saveErr", "errNone"); const first = $("grid").querySelector(".tm"); if (first) first.focus(); return; }
  if (!S.accepted) {
    $("accept2Box").hidden = false;
    $("accept2Box").classList.add("bad");
    setErr(null, "accept2Err", "errAccept");
    $("accept2").focus();
    return;
  }
  // A studio that came straight here still needs a name, a WhatsApp and an address.
  if (checkDetails().length) { go(1); const b = checkDetails(); if (b.length) $(b[0]).focus(); return; }

  const payload = buildPayload(list);
  if (LIVE) {
    S.saving = true;
    const btn = $("save");
    btn.disabled = true; btn.textContent = t("saving");
    try {
      const r = await fetch(SAVE_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ops: "studio_signup", payload }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.ok === false) throw new Error(j.error || String(r.status));
    } catch (err) {
      setErr(null, "saveErr", "errSave");
      btn.disabled = false; btn.textContent = t("save");
      S.saving = false;
      return;
    }
    btn.disabled = false; btn.textContent = t("save");
    S.saving = false;
  } else {
    // Preview: nothing leaves the browser. The payload is shown in the console
    // so the backend can be built against the exact shape.
    try { console.info("[socios] preview, not sent:", { ops: "studio_signup", payload }); } catch (_) {}
  }
  S.sent.push({ list, dur: S.dur, repeat: S.repeat });
  go(3);
});

// ---------------------------------------------------------------- step 3
$("more").addEventListener("click", () => {
  S.sel = {};
  $("dropNote").textContent = "";
  go(2);
});

// ---------------------------------------------------------------- personal link
// /socios?s=<slug>: a read-only select of the studio's public listing.
async function loadPartner() {
  if (!SLUG_OK) return;
  try {
    const ctl = "AbortController" in window ? new AbortController() : null;
    if (ctl) setTimeout(() => ctl.abort(), 7000);
    const url = `${SB}/rest/v1/partners?select=business_name,phone,whatsapp,address,neighbourhood,opening_hours,slug,price_from&slug=eq.${encodeURIComponent(SLUG)}&limit=1`;
    const r = await fetch(url, { headers: { apikey: SB_KEY, Accept: "application/json" }, signal: ctl ? ctl.signal : undefined });
    if (!r.ok) return;
    const rows = await r.json();
    const p = Array.isArray(rows) ? rows[0] : null;
    if (!p || !p.business_name) return;
    S.partner = p;
    const fill = (id, v) => { if (v && !val(id)) $(id).value = v; };
    fill("name", p.business_name);
    fill("wa", (p.whatsapp || p.phone) ? pretty(p.whatsapp || p.phone) : "");
    const addr = String(p.address || "").trim();
    const hood = String(p.neighbourhood || "").trim();
    fill("addr", addr && hood && !addr.toLowerCase().includes(hood.toLowerCase()) ? `${addr} (${hood})` : addr || hood);
    fill("hours", p.opening_hours || "");
    HOURS = parseHours(val("hours"));
    paintDynamic();
  } catch (_) { /* a personal link that cannot load is just the plain page */ }
}

// ---------------------------------------------------------------- start
paintStatic();
const startStep = stepFromHash() === 3 ? 0 : stepFromHash();
history.replaceState({ step: startStep }, "", location.pathname + location.search + HASH[startStep]);
go(startStep, false);
loadPartner().then(() => { if (S.step === 2) renderTimes(); });
})();
</script>
