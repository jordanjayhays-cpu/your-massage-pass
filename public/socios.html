<!--
  socios.html (17 Oct): the partnership page Jordan sends to studios by email
  or WhatsApp. Its one job is to get a studio to give us the times it would
  like to offer to Massage Club clients, so the bot can send customers its way.

  Flow: landing, then 1 "Vuestro centro" (name, WhatsApp), 2 "Vuestras horas"
  (every week by default, or these dates only), 3 "Últimos datos" (address,
  optional email, hours and prices, the terms), then the result screen.

  Personal link: /socios?s=<partners.slug> greets the studio and prefills its
  details with a read-only select on the public partners table. Only a studio
  whose row is status 'active' is offered "Ir directo a las horas"; a pending
  listing goes through step 1 like anyone else.

  A draft (fields, times, mode, duration) is kept in localStorage per link, so
  a reload or WhatsApp's in-app browser coming back does not lose anything. It
  is cleared after a save.

  SAVING. Live is the default; ?preview=1 sends nothing and says so.
  The page POSTs {"ops":"studio_signup","payload":{...}} to wa-bot?socios=1
  and counts it as saved ONLY on HTTP 2xx with JSON {"ok":true,"id":...}.
  Anything else (today: wa-bot has no studio_signup op and answers the CORS
  preflight for ?socios=1 with a plain "OK", so the browser blocks the POST)
  shows "Falta un paso": the studio sends the same times by WhatsApp to
  +34 612 474 827 (text prefilled) or by email to jordan@massageclub.io, so
  the times are never lost and the page never says "Recibido" when nothing
  was kept.

  Contract for studio_signup (to be built in supabase/functions, not here):
  - A submission is UNVERIFIED. The save is unauthenticated and slugs are
    public, so anyone can fill this in for any studio. Store it for Jordan's
    review and tell him. It must never create released slots that count as
    the studio's tap (PRE-RELEASED SLOTS rule), and never overwrite an
    existing partner's whatsapp, email or opening_hours automatically. The
    times are confirmed on the studio's existing WhatsApp before any of them
    is offered; the result screen tells the studio exactly that.
  - For a studio we already work with, prefer sending the signed slots link
    (wa-bot ops slot_link) over /socios?s=<slug>#horas.
  - OPTIONS wa-bot?socios=1 answers 204 with CORS; the POST answers JSON
    {ok:true,id} with CORS.
  - The fallback WhatsApp text always starts "Hola, Massage Club. Somos <name>,
    centro de masaje." From a number that is not a partner, wa-bot today puts
    it in the customer flow, and from a partner number handleStudioReply may
    read a time in it as an answer to an open ask. Route that opening line to
    Jordan before this page goes to studios.

  No tracking, no external JS, nothing sent on page load.
-->
<style>
:root{
  --page:#F1EBE2; --ink:#262019; --muted:#8A7F73; --muted-ink:#62584E; --clay:#B85C38; --clay-ink:#9A4A2C;
  --cream:#FAF6F0; --line:#F0E9E0; --edge:#DCD0C0; --field:#9C9083; --white:#FFFFFF; --bad:#A3271C; --wa:#1F8F4E;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--sans);font-size:17px;line-height:1.5;color:var(--ink);background:var(--page);overflow-x:hidden;min-height:100vh}
body.docked{padding-bottom:92px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--clay-ink);text-underline-offset:3px}
img{display:block;max-width:100%}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--clay-ink);outline-offset:3px;border-radius:8px}
.skiplink{position:absolute;left:16px;top:-60px;background:var(--ink);color:var(--cream);padding:12px 16px;border-radius:10px;z-index:20;text-decoration:none;font-weight:700}
.skiplink:focus{top:12px}
.ico{width:22px;height:22px;flex:none;fill:currentColor}

.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:4px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;min-height:48px;text-decoration:none;color:var(--ink);flex:1;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 1px var(--edge)}
.brand span{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.lang{min-width:52px;height:44px;padding:0 14px;border-radius:999px;background:var(--cream);border:1.5px solid var(--edge);font-size:15px;font-weight:700}
.lang:hover{border-color:var(--field)}

/* Landing */
.hero{padding:18px 0 8px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--clay-ink)}
.hello{font-family:var(--serif);font-size:20px;line-height:1.5;color:var(--clay-ink);margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello.reserve{visibility:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.015em;color:var(--ink)}
h1{font-size:clamp(31px,8.6vw,46px);line-height:1.08;margin-top:10px}
h2{font-size:clamp(26px,7vw,32px);line-height:1.12}
h3{font-size:21px;line-height:1.2}
.lead{font-size:18px;line-height:1.5;margin-top:14px;color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:14px 20px;border-radius:16px;font-size:18px;font-weight:700;text-align:center;text-decoration:none;transition:transform .1s,background-color .15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--clay);color:var(--white);box-shadow:0 10px 24px rgba(184,92,56,.28)}
.btn-primary:hover{background:var(--clay-ink)}
.btn-secondary{background:var(--cream);color:var(--ink);border:1.5px solid var(--field);font-size:16.5px;min-height:52px}
.btn-secondary .ico{color:var(--wa)}
.btn-secondary .ico.plain{color:var(--muted-ink)}
.btn-text{min-height:48px;padding:10px 6px;font-size:16px;font-weight:700;color:var(--clay-ink);text-decoration:underline;text-underline-offset:3px;width:auto}
.btn[disabled]{opacity:.6;cursor:progress}
.ctas{display:grid;gap:10px;margin-top:22px}
.note{font-size:15px;color:var(--muted-ink);text-align:center}
.proof{margin-top:22px;padding:14px 16px;border-left:3px solid var(--clay);background:var(--cream);border-radius:0 14px 14px 0;font-size:16px;color:var(--ink)}

.sec{margin-top:36px}
.sec > h2{margin-bottom:14px}
.benefits{list-style:none;display:grid;gap:10px}
.benefits li{display:flex;gap:12px;align-items:flex-start;background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16px}
.tick{flex:none;width:26px;height:26px;border-radius:50%;background:var(--clay);color:var(--white);display:grid;place-items:center;font-size:15px;font-weight:700;margin-top:1px}
.benefits b{display:block;font-size:17px}
.steps{list-style:none;counter-reset:s;display:grid;gap:14px}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;font-size:16.5px}
.steps li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--clay);color:var(--clay-ink);font-family:var(--serif);font-weight:700;font-size:18px;display:grid;place-items:center;background:var(--cream)}

.terms{background:var(--cream);border:2px solid var(--clay);border-radius:20px;padding:20px 18px}
.terms h2{font-size:clamp(22px,6.2vw,27px)}
.terms ul{list-style:none;margin-top:14px;display:grid;gap:0}
.terms li{padding:11px 0;border-top:1px solid var(--line);font-size:16.5px}
.terms li:first-child{border-top:0}
.terms li.cmp{font-size:15px;color:var(--muted-ink);border-top:1px dashed var(--edge);margin-top:4px;padding-top:14px}

.faq{display:grid;gap:8px}
.faq details{background:var(--cream);border:1px solid var(--line);border-radius:14px}
.faq summary{list-style:none;cursor:pointer;min-height:52px;padding:13px 48px 13px 16px;font-weight:700;font-size:16.5px;position:relative;border-radius:14px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:24px;font-weight:400;color:var(--clay-ink)}
.faq details[open] summary::after{content:"\2212"}
.faq details p{padding:0 16px 16px;font-size:16px}

.contact{margin:36px 0 28px;padding-top:20px;border-top:1px solid var(--edge);font-size:16px}
.contact b{font-family:var(--serif);font-size:18px}
.contact .ctas{margin-top:14px}
.seeus{margin-top:16px;font-size:15px;color:var(--muted-ink)}
.seeus a{display:inline-flex;align-items:center;min-height:44px;font-weight:700}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(241,235,226,.96);border-top:1px solid var(--edge);padding:12px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dock .btn{max-width:568px;margin:0 auto}

/* Flow */
.flow{padding:2px 0 40px}
.preview{display:inline-block;font-size:13.5px;color:var(--muted-ink);background:var(--cream);border:1px dashed var(--field);border-radius:999px;padding:5px 12px;margin:0 0 8px}
.progress{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.progress li{font-size:12.5px;font-weight:700;color:var(--muted-ink);line-height:1.3}
.progress li::before{content:"";display:block;height:5px;border-radius:5px;background:var(--edge);margin-bottom:5px}
.progress li.done::before,.progress li[aria-current="step"]::before{background:var(--clay)}
.progress li[aria-current="step"]{color:var(--ink)}
.step h2{outline:none;font-size:clamp(25px,6.8vw,30px)}
.step .sub{margin-top:6px;font-size:16px;color:var(--ink)}
.step .sub.tight{margin-top:0;font-size:15px;color:var(--muted-ink)}
.step .hello{margin-top:0;margin-bottom:4px}

.field{margin-top:18px}
.field label,.field .lbl{display:block;font-size:16px;font-weight:700;margin-bottom:6px}
.opt{font-weight:400;color:var(--muted-ink)}
.field input[type=text],.field input[type=tel],.field input[type=email]{width:100%;min-height:52px;background:var(--white);border:1.5px solid var(--field);border-radius:14px;padding:12px 14px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus{border-color:var(--clay-ink);box-shadow:0 0 0 3px rgba(184,92,56,.22)}
.field input[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 2px rgba(163,39,28,.15)}
.hint{font-size:14.5px;color:var(--muted-ink);margin-top:6px}
.warn{font-size:15px;color:var(--clay-ink);font-weight:700;margin-top:6px}
.warn:empty{display:none}
.err{font-size:15px;color:var(--bad);font-weight:700;margin-top:6px}
.err:empty{display:none}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.euro{position:relative}
.euro input{padding-right:36px !important}
.euro::after{content:"\20AC";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted-ink);font-weight:700;pointer-events:none}
.sublbl{display:block;font-size:14.5px;color:var(--muted-ink);margin-bottom:4px;font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:22px;padding:14px;background:var(--cream);border:1.5px solid var(--edge);border-radius:14px;cursor:pointer}
.check.bad{border-color:var(--bad)}
.check input{flex:none;width:26px;height:26px;margin-top:1px;accent-color:var(--clay)}
.check .ttl{font-weight:700;font-size:17px;display:block}
.check .line{display:block;font-weight:400;font-size:14.5px;color:var(--muted-ink);margin-top:4px}
.actions{display:grid;gap:6px;margin-top:22px;justify-items:center}

.who{display:flex;align-items:center;gap:4px;margin-top:2px;font-size:15px;color:var(--muted-ink);min-height:44px}
.who #whoText{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who b{color:var(--ink)}
.who .btn-text{flex:none;min-height:44px;padding:0 4px 0 8px;font-size:15px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:0;margin-top:12px}
.seg legend{font-size:15.5px;font-weight:700;margin-bottom:6px;padding:0}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:4px 8px;border-radius:14px;border:1.5px solid var(--field);background:var(--white);font-weight:700;font-size:16px;line-height:1.2}
.seg input:checked + span{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.seg input:focus-visible + span{outline:3px solid var(--clay-ink);outline-offset:3px}
.durrow{display:flex;align-items:center;gap:10px;margin-top:22px}
.durrow .dlbl{font-size:15.5px;font-weight:700}
.durrow .opts{display:flex;gap:8px;margin-left:auto}
.durrow label{position:relative;display:block}
.durrow input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.durrow label span{display:flex;align-items:center;justify-content:center;min-height:44px;min-width:84px;padding:0 12px;border-radius:12px;border:1.5px solid var(--field);background:var(--white);font-weight:700;font-size:15.5px}
.durrow label input:checked + span{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.durrow input:focus-visible + span{outline:3px solid var(--clay-ink);outline-offset:3px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.day{position:relative;min-height:54px;border-radius:14px;border:1.5px solid var(--field);background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;line-height:1.2}
.day.one{min-height:48px}
.day .dt{font-weight:700;font-size:15.5px}
.day .dd{font-size:13.5px;color:var(--muted-ink)}
.day[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.day[aria-pressed=true] .dd{color:#E9DFD2}
.badge{position:absolute;top:-7px;right:-5px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--clay);color:var(--white);font-size:13px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--page)}
.dayinfo{font-size:14.5px;color:var(--muted-ink);margin-top:10px}
.dayinfo b{color:var(--ink)}
.glabel{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-ink);margin:12px 0 8px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tm{min-height:50px;border-radius:12px;border:1.5px solid var(--field);background:var(--white);font-weight:700;font-size:16.5px;font-variant-numeric:tabular-nums}
.tm[aria-pressed=true]{background:var(--clay);border-color:var(--clay);color:var(--white)}
.tm[aria-pressed=true]::before{content:"\2713";margin-right:4px}
.empty{margin-top:14px;padding:14px;border-radius:14px;background:var(--cream);font-size:16px}
.copy{margin-top:14px;padding:12px;border-radius:14px;background:var(--cream);border:1.5px dashed var(--edge)}
.copy p{font-size:15px;font-weight:700}
.copy .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.copy button{min-height:44px;border-radius:12px;border:1.5px solid var(--field);background:var(--white);font-weight:700;font-size:15px;padding:4px 8px;line-height:1.2}
.summary{margin-top:18px;padding:16px;border-radius:16px;background:var(--white);border:1.5px solid var(--edge)}
.summary .sumlbl{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-ink);margin-bottom:4px}
.summary .sumhead{font-weight:700}
.summary ul{list-style:none;margin-top:8px;display:grid;gap:6px;font-size:16px}
.summary li b{margin-right:6px}
.summary .btn-text{margin-top:4px;padding-left:0}

.done-mark{width:64px;height:64px;border-radius:50%;background:var(--clay);color:var(--white);display:grid;place-items:center;font-size:32px;margin:8px 0 16px}
.next{list-style:none;display:grid;gap:10px;margin-top:16px}
.next li{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16.5px}
.msg{margin-top:10px;padding:14px;border-radius:14px;background:var(--white);border:1.5px solid var(--edge);font-size:14.5px;white-space:pre-wrap;word-break:break-word}

@media (min-width:720px){
  .wrap{padding:0 24px}
  .hero{padding-top:40px}
  .ctas{grid-template-columns:1fr;max-width:420px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <a class="brand" href="/socios" id="home">
      <img src="https://jglftdstrowwckwqmpue.supabase.co/storage/v1/object/public/branding/mc-avatar-cream.png" width="40" height="40" alt="" decoding="async">

  <main id="main" tabindex="-1">

    <!-- A. Landing -->
    <div id="landing">
      <section class="hero" aria-labelledby="h1">

          <button type="button" class="btn btn-secondary" id="knownCta" data-go="2" data-t="ctaKnown" hidden></button>
          <p class="note" data-t="ctaNote"></p>
        </div>

// ---------------------------------------------------------------- phone
// Stored like every other number: "+<country><number>". A Spanish number typed
// without a prefix ("660 390 910") is +34.
function intl(v) {
  let d = String(v || "").replace(/[^0-9+]/g, "");

}

}

};

const DKEY = "socios-draft-v2:" + (PREVIEW ? "preview:" : "") + (SLUG_OK ? SLUG : "-");

function saveDraft() {
  try {
    localStorage.setItem(DKEY, JSON.stringify({
      v: 2, at: Date.now(), f: Object.fromEntries(FIELDS.map((id) => [id, $(id).value])),
      accepted: S.accepted, dur: S.dur, repeat: S.repeat, selW: setsOut(S.selW), selD: setsOut(S.selD), landlineOk: S.landlineOk,
    }));

function loadDraft() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(DKEY) || "null"); } catch (_) { return; }
  if (!d || d.v !== 2 || !(Date.now() - Number(d.at) < 30 * 864e5)) return;
  for (const id of FIELDS) if (d.f && typeof d.f[id] === "string") $(id).value = d.f[id];

// ---------------------------------------------------------------- navigation
const HASH = ["", "#centro", "#horas", "#datos", "#listo"];
const stepFromHash = () => Math.max(0, HASH.indexOf(location.hash));
const here = (step) => location.pathname + location.search + HASH[step];
const step1Valid = () => !!val("name") && waDigitsOk() && (!isLandline(intl(val("wa"))) || S.landlineOk === intl(val("wa")));
function go(step, mode = "push") {
  const asked = step;
  if (step === 3 && !step1Valid()) { S.resume = 3; step = 1; }
  if (step === 4 && !S.result) step = selList().length ? 3 : 2;
  if (step === 3 && !step1Valid()) step = 1;
  if (mode === "none" && step !== asked) mode = "replace";
  const prev = S.step;
  if (mode === "push") history.pushState({ step, prev }, "", here(step));
  else if (mode === "replace") history.replaceState({ step, prev: (history.state && typeof history.state.prev === "number") ? history.state.prev : -1 }, "", here(step));
  S.step = step;
  $("landing").hidden = step !== 0;
  $("flow").hidden = step === 0;
  $("progress").hidden = step === 4;
  document.querySelectorAll(".step").forEach((el) => { el.hidden = Number(el.dataset.step) !== step; });
  document.querySelectorAll("#progress li").forEach((li) => {
    const n = Number(li.dataset.n);
    if (n === step) li.setAttribute("aria-current", "step"); else li.removeAttribute("aria-current");
    li.classList.toggle("done", n < step);
  });

  if (step === 2) { paintWho(); renderTimes(); }
  if (step === 3) { renderMini(); paintHoursHint(); }
  if (step === 4) renderDone();
  updateDock();
  window.scrollTo(0, 0);
  const h = step === 0 ? null : $("s" + step + "h");
  if (h && mode !== "none") h.focus({ preventScroll: true });
}
// In-page back: the phone's back button and ours must agree, so when the entry

function back(target) {

  else go(target);
}
window.addEventListener("popstate", () => go(stepFromHash(), "none"));
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(Number(g.dataset.go)); return; }
  const b = e.target.closest("[data-back]");
  if (b) { e.preventDefault(); back(Number(b.dataset.back)); }
});
$("home").addEventListener("click", (e) => { e.preventDefault(); if (S.step !== 0) go(0); });
$("lang").addEventListener("click", () => {
  L = L === "es" ? "en" : "es";
  try {
    const u = new URL(location.href);

  } catch (_) {}

// The bottom bar: on the landing, the main button once the top one is out of

const visible = new Set();

  let on = false;

$("modeSet").addEventListener("change", (e) => {
  if (e.target.name !== "mode") return;
  const on = e.target.value === "weekly";

  const fromKey = S.day;
  const has = (o) => Object.values(o).some((s) => s.size);
  S.repeat = on;
  // Switching keeps what was chosen: weekdays become this week's dates, and back.
  if (on && !has(S.selW) && has(S.selD)) {
    for (const [iso, set] of Object.entries(S.selD)) {
      const wd = String(new Date(iso + "T12:00:00Z").getUTCDay());
      for (const m of set) (S.selW[wd] || (S.selW[wd] = new Set())).add(m);
    }
  } else if (!on && !has(S.selD) && has(S.selW)) {
    for (const d of dateDays()) {
      const set = S.selW[String(d.wd)];
      if (!set) continue;
      const ok = new Set(startsFor(d));
      for (const m of set) if (ok.has(m)) (S.selD[d.key] || (S.selD[d.key] = new Set())).add(m);
    }
  }
  // Stay on the same weekday.
  const wd = fromKey == null ? null : /^\d$/.test(fromKey) ? Number(fromKey) : new Date(fromKey + "T12:00:00Z").getUTCDay();
  const same = wd == null ? null : dayList().find((d) => d.wd === wd);

  const set = map[S.day] || (map[S.day] = new Set());
  if (set.has(m)) set.delete(m); else set.add(m);
  if (!set.size) delete map[S.day];

  for (const d of dayList()) {
    if (d.key === S.day || (wkOnly && !(d.wd >= 1 && d.wd <= 5))) continue;
    const ok = new Set(startsFor(d));
    let added = false;

// ---------------------------------------------------------------- step 3
function checkStep3() {
  const bad = [];
  setErr("addr", "addrErr", val("addr") ? "" : (bad.push("addr"), "errAddr"));
  const em = val("email");
  setErr("email", "emailErr", !em || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em) ? "" : (bad.push("email"), "errEmail"));
  const p60 = priceNum(val("p60")), p90 = priceNum(val("p90"));
  const pBad = Number.isNaN(p60) ? "p60" : Number.isNaN(p90) ? "p90" : "";
  setErr(null, "priceErr", pBad ? (bad.push(pBad), "errPrice") : "");
  $("p60").setAttribute("aria-invalid", Number.isNaN(p60) ? "true" : "false");
  $("p90").setAttribute("aria-invalid", Number.isNaN(p90) ? "true" : "false");
  S.accepted = $("accept").checked;
  setErr(null, "acceptErr", S.accepted ? "" : "errAccept");
  $("acceptBox").classList.toggle("bad", !S.accepted);
  if (!S.accepted) bad.push("accept");
  return bad;
}
$("accept").addEventListener("change", () => {
  S.accepted = $("accept").checked;
  if (S.accepted) { setErr(null, "acceptErr", ""); $("acceptBox").classList.remove("bad"); }
  saveDraft();
});
$("hours").addEventListener("input", () => {
  HOURS = parseHours(val("hours"));
  paintHoursHint();
  renderMini();
});
document.addEventListener("input", (e) => { if (e.target && FIELDS.includes(e.target.id)) saveDraft(); });

function buildPayload(list) {
  const wa = intl(val("wa"));
  return {
    form: "socios",
    form_version: FORM_VERSION,
    lang: L,
    // Anyone can open /socios?s=<slug>: nothing here is verified. Review it and
    // confirm on the studio's own WhatsApp before any of it is used.
    verified: false,
    link_slug: SLUG_OK ? SLUG : null,
    partner_slug: S.partner ? S.partner.slug : null,
    partner_status: S.partner ? String(S.partner.status || "") : null,
    studio: {
      business_name: val("name"),
      whatsapp: wa,
      whatsapp_looks_landline: isLandline(wa),
      address: val("addr"),
      email: val("email").toLowerCase() || null,
      opening_hours: val("hours") || null,
      opening_hours_read: HOURS ? hoursField(HOURS, "es") : null,
      price_60_eur: priceNum(val("p60")),
      price_90_eur: priceNum(val("p90")),
    },
    terms: {
      accepted: true,
      accepted_at: new Date().toISOString(),
      version: TERMS_VERSION,
      text: T[L].termsLine,
    },
    availability: {
      tz: "Europe/Madrid",
      duration_min: S.dur,
      repeat_weekly: S.repeat,
      slots: list.flatMap(({ d, mins }) => mins.map((m) => d.weekly
        ? { weekday: d.wd, start: hhmm(m), end: hhmm(m + S.dur), first_date: firstDate(d.wd, m), date: firstDate(d.wd, m) }
        : { date: d.iso, weekday: d.wd, start: hhmm(m), end: hhmm(m + S.dur) })),
    },
  };
}
const batchKey = (p) => JSON.stringify([p.studio.whatsapp, p.availability.duration_min, p.availability.repeat_weekly, p.availability.slots.map((s) => [p.availability.repeat_weekly ? s.weekday : s.date, s.start])]);
// The text a studio sends us itself when the save does not work.
function buildMessage(last) {
  const lines = [t("msgHello", { n: val("name") || "?" }), ""];
  const n = countOf(last.list);
  lines.push(t("msgTimes", { s: (n === 1 ? t("sum1", { d: last.dur }) : t("sumN", { n, d: last.dur })) + ", " + t(last.repeat ? "weekly" : "once") }));
  for (const { d, mins } of last.list) lines.push(dayLabel(d) + ": " + mins.map(hhmm).join(", "));
  lines.push("");
  lines.push(t("msgWa", { v: pretty(val("wa")) }));
  if (val("addr")) lines.push(t("msgAddr", { v: val("addr") }));
  if (val("email")) lines.push(t("msgEmail", { v: val("email") }));
  if (val("hours")) lines.push(t("msgHours", { v: val("hours") }));
  const p60 = priceNum(val("p60")), p90 = priceNum(val("p90"));
  const pr = [p60 ? "60 min " + euro(p60) : "", p90 ? "90 min " + euro(p90) : ""].filter(Boolean).join(", ");
  if (pr) lines.push(t("msgPrice", { v: pr }));
  lines.push(t("msgTerms"));
  return lines.join("\n");
}

async function send(btn) {
  if (S.saving) return;
  setErr(null, "saveErr", "");
  setErr(null, "miniErr", "");
  if (!step1Valid()) { S.resume = 3; go(1); const b = checkStep1(); if (b.length) $(b[0]).focus(); return; }
  const list = selList();
  if (!list.length) { go(2); setErr(null, "timesErr", "errNone"); return; }
  const bad = checkStep3();
  if (bad.length) { $(bad[0]).focus(); return; }
  const payload = buildPayload(list);
  const key = batchKey(payload);
  if (key === S.lastKey) { setErr(null, "saveErr", "dup"); return; }
  if (PREVIEW) {
    // Nothing leaves the browser. The payload is in the console so the backend
    // can be built against the exact shape.
    try { console.info("[socios] preview, not sent:", { ops: "studio_signup", payload }); } catch (_) {}
    return finish("preview", list, key);
  }
  S.saving = true;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = t("saving");
  let ok = false;
  try {
    const ctl = "AbortController" in window ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), 15000) : 0;
    const r = await fetch(SAVE_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ops: "studio_signup", payload }), signal: ctl ? ctl.signal : undefined });
    clearTimeout(timer);
    const j = await r.json().catch(() => null);
    // Saved only when the server says so in JSON. A plain "OK" is not a save.
    ok = r.ok && !!j && j.ok === true;
  } catch (_) { ok = false; }
  S.saving = false;
  btn.disabled = false; btn.textContent = label;
  finish(ok ? "saved" : "fallback", list, key);
}
function finish(result, list, key) {
  S.result = result;
  S.last = { list, dur: S.dur, repeat: S.repeat };
  if (result === "fallback") { go(4); return; } // back returns to the form, nothing lost
  // Sent: the selection is cleared so the phone's back button cannot send the
  // same batch again, and #datos becomes #listo in the history.
  S.lastKey = key;
  S.selW = {}; S.selD = {}; S.copied = null;
  clearDraft();
  go(4, "replace");
}
$("f3").addEventListener("submit", (e) => { e.preventDefault(); send($("save")); });
$("retry").addEventListener("click", () => send($("retry")));
$("more").addEventListener("click", () => { $("timesErr").textContent = ""; go(2); });

// ---------------------------------------------------------------- personal link
// /socios?s=<slug>: a read-only select of the studio's public listing.
let partnerDone = !SLUG_OK;
function pickWhatsApp(p) {
  // Never put a Spanish landline in "WhatsApp para las reservas".
  for (const v of [p.whatsapp, p.phone]) { const n = intl(v); if (n && n.replace(/\D/g, "").length >= 9 && !isLandline(n)) return pretty(n); }
  return "";
}
async function loadPartner() {
  if (!SLUG_OK) return;
  try {
    const ctl = "AbortController" in window ? new AbortController() : null;
    if (ctl) setTimeout(() => ctl.abort(), 7000);
    const url = `${SB}/rest/v1/partners?select=business_name,phone,whatsapp,address,neighbourhood,opening_hours,slug,price_from,status&slug=eq.${encodeURIComponent(SLUG)}&limit=1`;
    const r = await fetch(url, { headers: { apikey: SB_KEY, Accept: "application/json" }, signal: ctl ? ctl.signal : undefined });
    if (!r.ok) return;
    const rows = await r.json();
    const p = Array.isArray(rows) ? rows[0] : null;
    if (!p || !p.business_name) return;
    S.partner = p;
    S.active = String(p.status || "") === "active";
    const fill = (id, v) => { if (v && !val(id)) $(id).value = v; };
    fill("name", p.business_name);
    fill("wa", pickWhatsApp(p));
    const addr = String(p.address || "").trim();
    const hood = String(p.neighbourhood || "").trim();
    fill("addr", addr && hood && !addr.toLowerCase().includes(hood.toLowerCase()) ? `${addr} (${hood})` : addr || hood);
    // Hours go in as text in the page's language ("Lun-Sáb 10:00-20:00"), never
    // as an object; a string we cannot read goes in as it is.
    const oh = p.opening_hours;
    const map = oh ? parseHours(oh) : null;
    fill("hours", map ? hoursField(map, L) : typeof oh === "string" && !/^\s*\{/.test(oh) ? oh.trim() : "");
    HOURS = parseHours(val("hours"));
  } catch (_) { /* a personal link that cannot load is just the plain page */ }
  finally { partnerDone = true; }
}

// ---------------------------------------------------------------- start
loadDraft();
HOURS = parseHours(val("hours"));
paintStatic();
let startStep = stepFromHash();
if (startStep === 4) startStep = selList().length && step1Valid() ? 3 : 0;
if (startStep === 3 && !step1Valid()) startStep = val("name") || val("wa") ? 1 : 0;
// A reload keeps the entry's state: keep its "previous step" so our back
// buttons still match the phone's.
const hs = history.state;
history.replaceState({ step: startStep, prev: hs && hs.step === startStep && typeof hs.prev === "number" ? hs.prev : -1 }, "", here(startStep));
go(startStep, "none");
loadPartner().then(() => { paintDynamic(); });
})();
</script>
