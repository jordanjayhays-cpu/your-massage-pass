<!--
  socios.html (17 Oct, simplified 18 Oct): the partnership page Jordan sends
  to studios by email or WhatsApp. Its one job is to get a studio to give us
  the times it would like to offer to Massage Club clients, so the bot can
  send customers its way.

  Landing: what Massage Club is, what the studio gets, how a booking reaches
  it, what it costs, questions, who we are. One button.

  Flow: 1 "Vuestro centro" (name, address, WhatsApp, opening hours), 2 "Vuestras
  horas libres" (length, day, times; every week by default, or the next 7
  days only), 3 "Últimos datos" (email, price, the terms), then the result
  screen. Opening hours are asked on step 1, before the time grid, so the
  grid only shows times when the studio is open and nothing picked on step 2
  can vanish later (tester blocker, 18 Oct).

  Personal link: /socios?s=<partners.slug>&k=<sig> greets the studio and
  prefills its details from wa-bot (see Prefill below). A studio whose row is
  status 'active' and whose step 1 is complete goes straight to its times;
  a pending listing checks step 1 first (one tap).

  A draft (fields, times, mode, duration) is kept in localStorage per link, so
  a reload or WhatsApp's in-app browser coming back does not lose anything,
  and the page says so. It is cleared after a save.

  SAVING (wired 18 Oct, wa-bot v216). Live is the default; ?preview=1 sends
  nothing and says so (no save, no view logged).
  The page POSTs {"ops":"studio_signup","payload":{...}} to wa-bot?socios=1,
  which answers JSON {ok, status, message} with CORS for book.massageclub.io,
  massageclub.io and this project's previews (your-massage-pass-*.vercel.app):
  - status "applied": a SIGNED personal link (/socios?s=<slug>&k=<sig>, from
    Jordan's links page or the socios_link op). The link is the studio's own,
    so its times are saved at once as released times (PRE-RELEASED SLOTS,
    12 Oct): dated ones through release_slots, "every week" as weekly times
    that keep themselves filled for the next 7 days. Customers see them only
    when app_secrets RELEASED allows (the answer says, as "live"). On its
    own link the studio is the source of truth for where bookings reach it
    (review fix, 17 Oct): the booking WhatsApp, the email and the hours it
    gives replace ours (the old ones go on Jordan's card); a different
    address is only noted. Times are checked against the hours it gives,
    never outside 08:00 to 22:00. The terms the studio ticked are stored as
    its written acceptance (partner_terms), and only when the page sent them
    word for word as wa-bot has them for that version. That is why termsLine
    is shown in full beside the checkbox and never shortened: the words the
    studio sees are the words billing relies on.
    Screen: "Guardado", with a link to the studio's own times page.
  - status "pending_review": no link signature (the plain /socios, or a
    /socios?s=<slug> anyone can type). Nothing is saved or offered; Jordan
    gets a card with Aprobar / Rechazar. Screen: "Recibido, lo revisamos y os
    confirmamos por WhatsApp o email". Approving one for a studio we already
    have saves only its times: its details are not changed and no terms are
    recorded in its name (anyone can type a studio's number here).
  The price for the chosen length is required, unless it is the studio's own
  link and we already have its menu (prefill has_menu).
  - ok false with a message (a check failed, too many sends): shown under
    the button, nothing else changes.
  Only when the save cannot be reached at all (network, a server error, an
  answer that is not JSON) does the page show "Falta un paso": the studio
  sends the same times by WhatsApp to +34 612 474 827 (text prefilled) or by
  email to jordan@massageclub.io, so the times are never lost and the page
  never says "Guardado" when nothing was kept.
  The fallback WhatsApp text starts "Hola, Massage Club. Somos <name>,
  centro de masaje." and then "Horas que os ofrecemos (". wa-bot v216 reads
  that first, from any number (SOCIOS_FALLBACK_RE):
  the studio gets "Recibido, gracias. Lo revisamos y os confirmamos por
  aquí." and Jordan a card with the message. It never enters the customer
  flow and is never read as an answer to a booking ask.

  Prefill: GET wa-bot?socios=1&s=<slug>[&k=<sig>][&view=1]. A signed link
  also gets the email on file and whether a menu is on file, and logs one
  "link opened" (view=1, never in preview) for Jordan's links page. Without
  a signature only an active studio is prefilled (its public listing). If
  that call cannot be reached, an unsigned link falls back to the read-only
  select below.

  The page's other WhatsApp buttons open with "Hola, Massage Club. Somos
  <name>, centro de masaje." and no times. From a number that is not a
  partner, wa-bot answers once ("Gracias por escribirnos. Lo leemos y os
  contestamos por aquí.") and sends Jordan a studio card; that number stays
  out of the customer flow for 2 days.

  Email is required: released times are only offered at studios with an
  email, because the email always carries the client's phone and the 15
  minute reject link (build notes R7).

  The booking example on the landing copies wa-bot's released-time message
  (bot.ts studioText for relSlot) with a placeholder client. If that message
  changes, change the example.

  No tracking beyond that one "link opened" for a signed link, no external
  JS, nothing saved on page load.
-->
<style>
:root{
  --page:#F1EBE2; --ink:#262019; --muted:#8A7F73; --muted-ink:#5E544A; --clay:#B85C38; --clay-ink:#9A4A2C;
  --cream:#FAF6F0; --line:#EDE4D9; --edge:#DCD0C0; --field:#9C9083; --white:#FFFFFF; --bad:#A3271C; --wa:#1F7A45;
  --tint:#F6E4D9; --chat:#E9E1D5;
  --serif:Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--sans);font-size:17px;line-height:1.5;color:var(--ink);background:var(--page);overflow-x:hidden;min-height:100vh}
body.docked{padding-bottom:120px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--clay-ink);text-underline-offset:3px}
img{display:block;max-width:100%}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--clay-ink);outline-offset:3px;border-radius:8px}
.skiplink{position:absolute;left:16px;top:-60px;background:var(--ink);color:var(--cream);padding:12px 16px;border-radius:10px;z-index:20;text-decoration:none;font-weight:700}
.skiplink:focus{top:12px}
.ico{width:22px;height:22px;flex:none;fill:currentColor}

.wrap{max-width:600px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:4px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;min-height:48px;text-decoration:none;color:var(--ink);flex:1;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 1px var(--edge)}
.brand span{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.lang{min-width:52px;height:44px;padding:0 14px;border-radius:999px;background:var(--cream);border:1.5px solid var(--edge);font-size:15px;font-weight:700}
.lang:hover{border-color:var(--field)}

/* Landing */
.hero{padding:14px 0 6px}
.kicker{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--clay-ink)}
.hello{font-family:var(--serif);font-size:20px;line-height:1.5;color:var(--clay-ink);margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello.reserve{visibility:hidden}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.015em;color:var(--ink)}
h1{font-size:clamp(32px,9.4vw,46px);line-height:1.06;margin-top:8px}
h2{font-size:clamp(26px,7.2vw,32px);line-height:1.12}
.lead{font-size:18px;line-height:1.5;margin-top:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:14px 20px;border-radius:16px;font-size:18px;font-weight:700;line-height:1.25;text-align:center;text-decoration:none;transition:transform .1s,background-color .15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--clay);color:var(--white);box-shadow:0 10px 24px rgba(184,92,56,.28)}
.btn-primary:hover{background:var(--clay-ink)}
.btn-wait{background:var(--white);color:var(--ink);border:2px solid var(--field)}
.btn-secondary{background:var(--cream);color:var(--ink);border:1.5px solid var(--field);font-size:16.5px;min-height:52px}
.btn-secondary .ico{color:var(--wa)}
.btn-secondary .ico.plain{color:var(--muted-ink)}
.btn-text{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:10px 6px;font-size:16.5px;font-weight:700;color:var(--clay-ink);text-decoration:underline;text-underline-offset:3px;width:auto;border-radius:10px}
.btn-text .ico{width:20px;height:20px;color:var(--wa)}
.btn[disabled]{opacity:.6;cursor:progress}
.ctas{display:grid;gap:10px;margin-top:22px}
.note{font-size:15.5px;color:var(--muted-ink);text-align:center}
.note b{display:block;color:var(--ink)}

.sec{margin-top:40px}
.sec > h2{margin-bottom:14px}
.ic{width:28px;height:28px;flex:none}
.icon{flex:none;width:48px;height:48px;border-radius:14px;background:var(--tint);color:var(--clay-ink);display:grid;place-items:center;position:relative}
.cards{list-style:none;display:grid;gap:10px}
.cards li{display:flex;gap:14px;align-items:flex-start;background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:16px}
.cards h3{font-family:var(--sans);font-size:17.5px;line-height:1.3;letter-spacing:0;margin-top:2px}
.cards p{font-size:16px;color:var(--muted-ink);margin-top:4px}
.steps{list-style:none;display:grid;gap:16px}
.steps li{display:flex;gap:14px;align-items:flex-start}
.steps .sn{position:absolute;top:-7px;left:-7px;width:24px;height:24px;border-radius:50%;background:var(--clay);color:var(--white);font-size:13.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--page);font-family:var(--sans)}
.steps b{display:block;font-size:17.5px;line-height:1.3;margin-top:2px}
.steps span.d{display:block;font-size:16px;color:var(--muted-ink);margin-top:2px}

.ex{margin-top:20px}
.ex figcaption{font-size:15.5px;font-weight:700;margin-bottom:8px}
.chat{background:var(--chat);border-radius:18px;padding:14px 12px 12px}
.bubble{background:var(--white);border-radius:4px 16px 16px 16px;padding:9px 12px 6px;max-width:94%;box-shadow:0 1px 1px rgba(38,32,25,.10);font-size:15.5px;line-height:1.45}
.bubble .from{font-size:13.5px;font-weight:700;color:var(--wa)}
.bubble .lnk{color:#0B5F96;text-decoration:underline}
.bubble .when{font-size:12px;color:var(--muted-ink);text-align:right;margin-top:2px}
.exnote{font-size:15px;color:var(--muted-ink);margin-top:8px}
.exnote:empty{display:none}

.price{background:var(--cream);border:2px solid var(--clay);border-radius:20px;padding:20px 18px}
.price h2{margin-bottom:6px}
.prow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .k{font-size:16.5px;line-height:1.35}
.prow .k small{display:block;font-size:15px;color:var(--muted-ink);margin-top:2px}
.prow .v{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.2;white-space:nowrap;text-align:right}
.prow.free .v{color:var(--clay-ink);font-size:26px}
.payline{font-size:16px;margin-top:4px;padding-top:12px;border-top:1px solid var(--line)}
.cmp{margin-top:16px;padding-top:14px;border-top:1px dashed var(--edge)}
.cmp .cap{font-size:15.5px;font-weight:700}
.cmp .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cmp .box{border-radius:14px;padding:10px 12px;background:var(--white);border:1.5px solid var(--edge)}
.cmp .box.us{border:2px solid var(--clay)}
.cmp .box b{display:block;font-size:14.5px;color:var(--muted-ink)}
.cmp .box span{display:block;font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.25}
.cmp .src{font-size:14.5px;color:var(--muted-ink);margin-top:8px}

.faq{display:grid;gap:8px}
.faq details{background:var(--cream);border:1px solid var(--line);border-radius:14px}
.faq summary{list-style:none;cursor:pointer;min-height:54px;padding:14px 48px 14px 16px;font-weight:700;font-size:16.5px;position:relative;border-radius:14px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:24px;font-weight:400;color:var(--clay-ink)}
.faq details[open] summary::after{content:"\2212"}
.faq details p{padding:0 16px 16px;font-size:16px}

.contact{margin:40px 0 28px;padding-top:22px;border-top:1px solid var(--edge);font-size:16px}
.contact h2{margin-bottom:10px}
.contact .who2{display:flex;gap:12px;align-items:center}
.contact .who2 img{width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 1px var(--edge)}
.contact .who2 b{display:block;font-size:17px}
.contact .ctas{margin-top:14px}
.seeus{margin-top:14px;font-size:15px;color:var(--muted-ink)}
.seeus a{display:inline-flex;align-items:center;min-height:44px;font-weight:700}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(241,235,226,.97);border-top:1px solid var(--edge);padding:10px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.dock .btn{max-width:568px;margin:0 auto}
.dock .err{max-width:568px;margin:0 auto 8px;text-align:center;font-size:16px}

/* Flow */
.flow{padding:2px 0 32px}
.preview{display:inline-block;font-size:13.5px;color:var(--muted-ink);background:var(--cream);border:1px dashed var(--field);border-radius:999px;padding:5px 12px;margin:0 0 8px}
.stepno{font-size:15px;font-weight:700;color:var(--clay-ink);margin:2px 0 6px}
.progress{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.progress li{font-size:13px;font-weight:700;color:var(--muted-ink);line-height:1.3}
.progress li::before{content:"";display:block;height:6px;border-radius:6px;background:var(--edge);margin-bottom:5px}
.progress li.done::before,.progress li[aria-current="step"]::before{background:var(--clay)}
.progress li[aria-current="step"]{color:var(--ink)}
.step h2{outline:none;font-size:clamp(26px,7vw,31px)}
.step .sub{margin-top:6px;font-size:17px;color:var(--ink)}
.step .hello{margin-top:0;margin-bottom:4px}
.draftnote{font-size:15px;color:var(--muted-ink);text-align:center;margin-top:18px}

.field{margin-top:18px}
.field label,.field .lbl{display:block;font-size:17px;font-weight:700;margin-bottom:6px}
.opt{font-weight:400;color:var(--muted-ink)}
.field input[type=text],.field input[type=tel],.field input[type=email]{width:100%;min-height:54px;background:var(--white);border:1.5px solid var(--field);border-radius:14px;padding:12px 14px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus{border-color:var(--clay-ink);box-shadow:0 0 0 3px rgba(184,92,56,.22)}
.field input[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 2px rgba(163,39,28,.15)}
.hint{font-size:15.5px;color:var(--muted-ink);margin-top:6px}
.hint:empty{display:none}
.warn{font-size:15.5px;color:var(--clay-ink);font-weight:700;margin-top:6px}
.warn:empty{display:none}
.err{font-size:16px;color:var(--bad);font-weight:700;margin-top:6px}
.err:empty{display:none}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.euro{position:relative}
.euro input{padding-right:36px !important}
.euro::after{content:"\20AC";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted-ink);font-weight:700;pointer-events:none}
.sublbl{display:block;font-size:16px;margin-bottom:4px;font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:22px;padding:14px;background:var(--cream);border:1.5px solid var(--edge);border-radius:14px;cursor:pointer;scroll-margin:20px}
.check.bad{border-color:var(--bad)}
.check input{flex:none;width:28px;height:28px;margin-top:0;accent-color:var(--clay)}
.check .ttl{font-weight:700;font-size:17px;display:block}
.check .line{display:block;font-weight:400;font-size:16px;color:var(--ink);margin-top:4px}
.actions{display:grid;gap:6px;margin-top:22px;justify-items:center}
.miss{text-align:center;margin-top:16px}

.who{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:16px;color:var(--muted-ink);min-height:44px}
.who #whoText{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who b{color:var(--ink)}
.who .btn-text{flex:none;min-height:44px;padding:0 4px 0 8px;font-size:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:0;margin-top:20px}
.seg legend{font-size:17px;font-weight:700;margin-bottom:8px;padding:0}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:50px;padding:4px 8px;border-radius:14px;border:1.5px solid var(--field);background:var(--white);font-weight:700;font-size:16px;line-height:1.2}
.seg input:checked + span{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.seg input:focus-visible + span{outline:3px solid var(--clay-ink);outline-offset:3px}
.lbl2{font-size:17.5px;font-weight:700;margin:24px 0 8px;scroll-margin-top:12px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{position:relative;min-height:54px;border-radius:14px;border:1.5px solid var(--field);background:var(--white);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;line-height:1.2}
.day .dt{font-weight:700;font-size:16px}
.day .dd{font-size:13.5px;color:var(--muted-ink)}
.day[aria-current=true]{border:3px solid var(--clay-ink);background:var(--tint);color:var(--clay-ink)}
.day[aria-current=true] .dd{color:var(--clay-ink)}
.day[aria-current=true]::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--clay-ink);border-bottom:0}
.badge{position:absolute;top:-8px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--clay);color:var(--white);font-size:13.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--page)}
.dayinfo{font-size:16px;color:var(--muted-ink);margin:0 0 4px}
.dayinfo b{color:var(--ink)}
.glabel{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-ink);margin:12px 0 8px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tm{min-height:50px;border-radius:12px;border:1.5px solid var(--field);background:var(--white);font-weight:700;font-size:16.5px;font-variant-numeric:tabular-nums}
.tm[aria-pressed=true]{background:var(--clay);border-color:var(--clay);color:var(--white)}
.tm[aria-pressed=true]::before{content:"\2713";margin-right:4px}
.empty{margin-top:10px;padding:14px;border-radius:14px;background:var(--cream);font-size:16px}
.copy{margin-top:16px;padding:12px;border-radius:14px;background:var(--cream);border:1.5px dashed var(--edge)}
.copy p{font-size:16px;font-weight:700}
.copy .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.copy button{min-height:48px;border-radius:12px;border:1.5px solid var(--field);background:var(--white);font-weight:700;font-size:15.5px;padding:4px 8px;line-height:1.2}
.copy .copied{font-size:16px;font-weight:700;color:var(--clay-ink);margin-top:10px}
.summary{margin-top:20px;padding:16px;border-radius:16px;background:var(--white);border:1.5px solid var(--edge)}
.summary:empty{display:none}

// ---------------------------------------------------------------- Madrid time
// A dated time can be booked up to 60 minutes before (release_slots); the
// grid starts at 65, as the studio's times page does.
const LEAD_MIN = 65;
function madridNow() {
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Madrid", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
  const g = (k) => Number((p.find((x) => x.type === k) || {}).value || 0);
  return { y: g("year"), m: g("month"), d: g("day"), min: (g("hour") % 24) * 60 + g("minute") };
}
const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");

// "Mon-Sat 10:00-20:00", "Daily 10:00-21:00") or the object PartnerCalendar
// writes ({mon: {open, close, closed}}). Read like wa-bot slotHours: a day can
// have several windows, and a window with no day of its own ("y 17:00-21:00")
// belongs to the days before it. It also takes the ways people type hours in
// Spanish: "de lunes a sábado, de 10 a 21", "L-S 10-21h", "Lun a Vie 10-20",
// "10h-20h", "todos los días de 10 a 21". Anything else is null ("cannot

    .replace(/\b(?:todos los dias(?: de la semana)?|toda la semana|diariamente|diario|daily|every ?day|cada dia|(?:los )?7 dias(?: de la semana)?|siete dias)\b/g, " lun-dom ")
    .replace(/\b(?:(?:los )?fines? de semana|weekends?)\b/g, " sab y dom ")
    .replace(/\b(?:(?:de |los )?(?:dias )?laborables|entre semana|weekdays?)\b/g, " lun-vie ")

let HOURS = null;
const DEFAULT_WIN = [[8 * 60, 22 * 60]]; // as wa-bot REL_DEFAULT_HOURS

// SOC_DAY_WINDOW, review fix 17 Oct).
const DAY_WIN = [8 * 60, 22 * 60];

// ---------------------------------------------------------------- navigation
const HASH = ["", "#centro", "#horas", "#datos", "#listo"];
const stepFromHash = () => Math.max(0, HASH.indexOf(location.hash));
const here = (step) => location.pathname + location.search + HASH[step];
const step1Valid = () => !!val("name") && !!val("addr") && waDigitsOk() && (!isLandline(intl(val("wa"))) || S.landlineOk === intl(val("wa")));
function go(step, mode = "push") {
  const asked = step;
  if (step === 3 && !step1Valid()) { S.resume = 3; step = 1; }
  if (step === 4 && !S.result) step = selList().length ? 3 : 2;
  if (step === 3 && !step1Valid()) step = 1;
  if (mode === "none" && step !== asked) mode = "replace";
  const prev = S.step;
  if (mode === "push") history.pushState({ step, prev }, "", here(step));
  else if (mode === "replace") history.replaceState({ step, prev: (history.state && typeof history.state.prev === "number") ? history.state.prev : -1 }, "", here(step));
  S.step = step;
  $("landing").hidden = step !== 0;
  $("flow").hidden = step === 0;
  $("progress").hidden = step === 4;
  document.querySelectorAll(".step").forEach((el) => { el.hidden = Number(el.dataset.step) !== step; });
  document.querySelectorAll("#progress li").forEach((li) => {
    const n = Number(li.dataset.n);
    if (n === step) li.setAttribute("aria-current", "step"); else li.removeAttribute("aria-current");
    li.classList.toggle("done", n < step);
  });
  paintStepBits();
  if (step !== 2) setErr(null, "timesErr", "");
  // Our "Volver" goes where the phone's back button would.
  const st = history.state || {};
  if (step === 1) { paintWa(); $("back0").dataset.back = st.prev === 2 ? "2" : "0"; }
  if (step === 2) { paintWho(); renderTimes(); $("back1").dataset.back = st.prev === 0 ? "0" : "1"; }
  if (step === 3) { renderMini(); paintPriceOpt(); }
  if (step === 4) renderDone();
  if (step === 0) paintDynamic();
  updateDock();
  window.scrollTo(0, 0);
  const h = step === 0 ? null : $("s" + step + "h");
  if (h && mode !== "none") h.focus({ preventScroll: true });
}
// In-page back: the phone's back button and ours must agree, so when the entry
// before this one is the step we want, it is simply history.back().
function back(target) {
  const st = history.state || {};
  if (st.step === S.step && st.prev === target) history.back();
  else go(target);
}
window.addEventListener("popstate", () => go(stepFromHash(), "none"));
document.addEventListener("click", (e) => {
  const s = e.target.closest("[data-start]");
  if (s) { e.preventDefault(); start(); return; }
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(Number(g.dataset.go)); return; }
  const b = e.target.closest("[data-back]");
  if (b) { e.preventDefault(); back(Number(b.dataset.back)); }
});
$("home").addEventListener("click", (e) => { e.preventDefault(); if (S.step !== 0) go(0); });
$("lang").addEventListener("click", () => {
  L = L === "es" ? "en" : "es";
  try {
    const u = new URL(location.href);

// The bottom bar: on the landing, the main button once the top one is out of
// view; on the times step, always, saying what it needs or how many are chosen.
const visible = new Set();
let seenScroll = false;
function updateDock() {
  let on = false;
  const b = $("dockBtn");
  let ready = true;
  if (S.step === 2) {
    const n = countOf(selList());
    b.textContent = n === 0 ? t("next2Zero") : n === 1 ? t("next2One") : t("next2N", { n });
    ready = n > 0;
    on = true;
  } else if (S.step === 0 && "IntersectionObserver" in window && !visible.has("heroCta") && !visible.has("finalCta") && seenScroll) {
    b.textContent = ctaLabel();
    on = true;
  }

  b.classList.toggle("btn-wait", !ready);

if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver((entries) => {
    for (const en of entries) { if (en.isIntersecting) visible.add(en.target.id); else visible.delete(en.target.id); }
    updateDock();
  });
  io.observe($("heroCta")); io.observe($("finalCta"));
  window.addEventListener("scroll", () => { if (!seenScroll && window.scrollY > 40) { seenScroll = true; updateDock(); } }, { passive: true });

$("modeSet").addEventListener("change", (e) => {

  if (on && !has(S.selW) && has(S.selD)) {
    for (const [iso, set] of Object.entries(S.selD)) {
      const wd = String(new Date(iso + "T12:00:00Z").getUTCDay());

    }
  } else if (!on && !has(S.selD) && has(S.selW)) {
    for (const d of dateDays()) {
      const set = S.selW[String(d.wd)];
      if (!set) continue;

      for (const m of set) if (ok.has(m)) (S.selD[d.key] || (S.selD[d.key] = new Set())).add(m);
    }

  // Stay on the same weekday.
  const wd = fromKey == null ? null : /^\d$/.test(fromKey) ? Number(fromKey) : new Date(fromKey + "T12:00:00Z").getUTCDay();

  if (S.saving) return;
  setErr(null, "saveErr", "");
  setErr(null, "miniErr", "");
  if (!step1Valid()) { S.resume = 3; go(1); const b = checkStep1(); if (b.length) focusField(b[0]); return; }
  const list = selList();
  if (!list.length) { go(2); setErr(null, "timesErr", "errNone"); return; }
  if (countOf(list) > MAX_TIMES) { go(2); setErr(null, "timesErr", "errMany"); return; }
  const bad = checkStep3();
  S.miss = bad;
  paintMiss();
  if (bad.length) { focusField(bad[0]); return; }
  const payload = buildPayload(list);
  const key = batchKey(payload);
  if (key === S.lastKey) { setErr(null, "saveErr", "dup"); return; }
  if (PREVIEW) {
    // Nothing leaves the browser. The payload is in the console so the backend
    // can be built against the exact shape.
    try { console.info("[socios] preview, not sent:", { ops: "studio_signup", payload }); } catch (_) {}
    return finish("preview", list, key);
  }
  S.saving = true;
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = t("saving");
  // "applied" or "pending_review": kept. ok false with a message (a check, the
  // rate limit): said under the button, nothing else changes. Anything else
  // (no network, a server error, an answer that is not JSON) is the WhatsApp
  // and email fallback, so the times are never lost.
  let kind = "fallback", j = null;
  try {
    const ctl = "AbortController" in window ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), 15000) : 0;
    const r = await fetch(SAVE_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ops: "studio_signup", payload }), signal: ctl ? ctl.signal : undefined });
    clearTimeout(timer);
    j = await r.json().catch(() => null);
    // Saved only when the server says so in JSON. A plain "OK" is not a save.
    if (r.ok && j && j.ok === true && (j.status === "applied" || j.status === "pending_review")) kind = j.status;
    else if (r.status >= 400 && r.status < 500 && j && j.ok === false && typeof j.message === "string" && j.message) kind = "refused";
  } catch (_) { kind = "fallback"; }
  S.saving = false;
  btn.disabled = false; btn.textContent = label;
  if (kind === "refused") {
    const el = $("saveErr");
    el.dataset.k = "";
    el.textContent = j.message;
    if (S.step !== 3) go(3);
    return;
  }
  finish(kind === "applied" ? "saved" : kind === "pending_review" ? "received" : "fallback", list, key, kind === "fallback" ? null : j);
}
function finish(result, list, key, server) {
  S.result = result;
  S.server = server || null;
  S.last = { list, dur: S.dur, repeat: S.repeat };
  if (result === "fallback") { go(4); return; } // back returns to the form, nothing lost
  // Sent: the selection is cleared so the phone's back button cannot send the
  // same batch again, and #datos becomes #listo in the history.
  S.lastKey = key;
  S.selW = {}; S.selD = {}; S.copied = null;
  clearDraft();
  go(4, "replace");
}
$("f3").addEventListener("submit", (e) => { e.preventDefault(); send($("save")); });
$("retry").addEventListener("click", () => send($("retry")));
$("more").addEventListener("click", () => { setErr(null, "timesErr", ""); go(2); });

// ---------------------------------------------------------------- personal link
// /socios?s=<slug>[&k=<sig>]: wa-bot's prefill. A signed link also gets the
// email on file and logs one "link opened" for Jordan (view=1, never in
// preview). If wa-bot cannot be reached, an unsigned link falls back to a
// read-only select of the studio's public listing.
let partnerDone = !SLUG_OK;
function pickWhatsApp(p) {
  // Never put a Spanish landline in "WhatsApp para las reservas".
  for (const v of [p.whatsapp, p.phone]) { const n = intl(v); if (n && n.replace(/\D/g, "").length >= 9 && !isLandline(n)) return pretty(n); }
  return "";
}
function fillPartner(p, withEmail) {
  if (!p || !p.business_name) return;
  S.partner = p;
  S.active = String(p.status || "") === "active" || p.active === true;
  const fill = (id, v) => { if (v && !val(id)) $(id).value = v; };
  fill("name", p.business_name);
  fill("wa", pickWhatsApp(p));
  if (withEmail) fill("email", String(p.email || "").trim().toLowerCase());
  const addr = String(p.address || "").trim();
  const hood = String(p.neighbourhood || "").trim();
  fill("addr", addr && hood && !addr.toLowerCase().includes(hood.toLowerCase()) ? `${addr} (${hood})` : addr || hood);
  // Hours go in as text in the page's language ("Lun-Sáb 10:00-20:00"), never
  // as an object; a string we cannot read goes in as it is.
  const oh = p.opening_hours;
  const map = oh ? parseHours(oh) : null;
  fill("hours", map ? hoursField(map, L) : typeof oh === "string" && !/^\s*\{/.test(oh) ? oh.trim() : "");
  HOURS = parseHours(val("hours"));
}
async function getJson(url, init, ms) {
  const ctl = "AbortController" in window ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), ms) : 0;
  try {
    const r = await fetch(url, Object.assign({}, init, { signal: ctl ? ctl.signal : undefined }));
    return { ok: r.ok, j: await r.json().catch(() => null) };
  } finally { clearTimeout(timer); }
}
async function loadPartner() {
  if (!SLUG_OK) return;
  try {
    let reached = false;
    try {
      const qs = "?socios=1&s=" + encodeURIComponent(SLUG) + (SIG_OK ? "&k=" + SIG + (PREVIEW ? "" : "&view=1") : "");
      const { ok, j } = await getJson(API + qs, { headers: { Accept: "application/json" } }, 7000);
      if (ok && j && j.ok === true) {
        reached = true;
        S.signed = j.status === "signed";
        if (j.partner) fillPartner(j.partner, S.signed);
      }
    } catch (_) { /* fall through */ }
    if (reached || SIG_OK) return;
    const url = `${SB}/rest/v1/partners?select=business_name,phone,whatsapp,address,neighbourhood,opening_hours,slug,price_from,status&slug=eq.${encodeURIComponent(SLUG)}&limit=1`;
    const { ok, j } = await getJson(url, { headers: { apikey: SB_KEY, Accept: "application/json" } }, 7000);
    if (ok && Array.isArray(j) && j[0]) fillPartner(j[0], false);
  } catch (_) { /* a personal link that cannot load is just the plain page */ }
  finally { partnerDone = true; }
}

// ---------------------------------------------------------------- start
loadDraft();
HOURS = parseHours(val("hours"));
paintStatic();
let startStep = stepFromHash();
if (startStep === 4) startStep = selList().length && step1Valid() ? 3 : 0;
if (startStep === 3 && !step1Valid()) startStep = val("name") || val("wa") ? 1 : 0;
// A reload keeps the entry's state: keep its "previous step" so our back
// buttons still match the phone's.
const hs = history.state;
history.replaceState({ step: startStep, prev: hs && hs.step === startStep && typeof hs.prev === "number" ? hs.prev : -1 }, "", here(startStep));
go(startStep, "none");
loadPartner().then(() => { paintDynamic(); });
})();
</script>
