<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a massage in Madrid · Massage Club</title>
<meta name="description" content="Pick the massage, day and area. We ask the studios. You pay at the studio.">
<meta name="theme-color" content="#B85C38">
<meta property="og:title" content="Book a massage in Madrid">
<meta property="og:description" content="Pick the massage, day and area. We ask the studios. You pay at the studio.">
<link rel="canonical" href="https://book.massageclub.io/reserve">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Desktop only (900px and up): Outfit, the font of the rest of the site.
     The media attribute keeps it off phones: not render-blocking there, and
     no font file is fetched because nothing uses it under 900px. -->
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" media="(min-width:900px)">
<!--
  go.html (5 Oct, Jordan): "partiful.com and book.massageclub.io, i want to mix
  these. Aesthetically pleasing to book a massage and simple, while capturing
  the info to rebook them next month."

  One question per screen, most answered with a single tap that moves on by
  itself. Same backend as the website wizard: POST to the `lead` function,
  which writes whatsapp_requests and starts the studio asks.

  UX batch 1 (2 Nov): this page is the request flow for the whole site
  (/reserve, and the home page after HN1).
  - It opens on the massage question. The hello poster went: 3 of 7 real
    visitors left there, and it claimed things we cannot back.
  - The details screen asks for a name and an email (required, every booking
    needs one) and an optional WhatsApp number. Send is never silently
    disabled: it checks on tap and says what is missing, next to the field.
  - The reminder is one opt-in toggle, off by default.
  - The sent screen shows the request number and what happens next. The
    WhatsApp button only shows with a phone, because the bot joins a web
    request by its "(#id)" plus the same phone (wa-bot WEB_HANDOFF_RE).

  Desktop (2 Nov, fix F10): from 900px the page has the site header and
  footer, the flow card on the left and a sticky "What happens next" card on
  the right, line icons instead of emoji and hover states. Under 900px
  nothing changes (see the desktop block at the end of the <style>).

  Prefill from the URL: ?n=<first name>&p=<phone>&e=<email>&lang=es&src=<where
  the visitor came from>. n, p and e are read once and removed from the
  address bar before anything is tracked.
-->
<style>
:root{
  --clay:#B85C38; --clay-d:#9A4A2C; --peach:#E8B79E; --sage:#A9BFA6; --plum:#5B4A6E;
  --cream:#F6F1EA; --ink:#262019; --muted:#6B6157; --line:rgba(38,32,25,.10);
  --glass:rgba(255,252,248,.78); --chip:#fff; --bad:#B03A2E;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:'DM Sans',-apple-system,system-ui,sans-serif;color:var(--ink);background:var(--cream);overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}

/* The Partiful "theme": a slow, living gradient behind everything. */
.bg{position:fixed;inset:-20%;z-index:-1;background:var(--cream);filter:blur(60px) saturate(115%)}
.bg i{position:absolute;border-radius:50%;opacity:.85;animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:60vmax;height:60vmax;background:var(--clay);top:-12%;right:-18%}
.bg i:nth-child(2){width:48vmax;height:48vmax;background:var(--peach);bottom:-10%;left:-12%;animation-duration:22s}
.bg i:nth-child(3){width:30vmax;height:30vmax;background:var(--sage);bottom:18%;right:4%;animation-duration:26s}
.bg i:nth-child(4){width:22vmax;height:22vmax;background:#F2D3B8;top:30%;left:20%;animation-duration:30s}
@keyframes drift{to{transform:translate(6%,8%) scale(1.12)}}
@media (prefers-reduced-motion:reduce){.bg i{animation:none}}

.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;height:44px}
.back{width:44px;height:44px;border-radius:50%;background:var(--glass);backdrop-filter:blur(12px);display:grid;place-items:center;font-size:18px;flex:none}
/* The wordmark sits where Back would be, on the first and the last screen. */
.mark{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;flex:none}
.bar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.55);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--ink);border-radius:6px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.lang{font-size:13px;font-weight:700;padding:0 14px;min-height:44px;border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);flex:none}

.stage{flex:1;position:relative;margin-top:12px}
.screen{display:none;animation:in .38s cubic-bezier(.2,.8,.2,1)}
.screen.on{display:block}
.screen.backwards{animation-name:inback}
@keyframes in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inback{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}

.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--clay-d)}
h1,h2{font-family:'Fraunces',Georgia,serif;font-weight:800;letter-spacing:-.02em;line-height:1.02}
h2{font-size:clamp(30px,8.6vw,38px);margin:4px 0 6px}
.sub{color:rgba(38,32,25,.74);font-size:16px;line-height:1.45;margin-bottom:18px}
/* Price chip (31 Oct): research found not one price on this page, and price is
   among the first things people ask the bot. It is the bot's own range (wa-bot
   copy.ts priceInfo, 50 to 85 EUR for 60 min), never a quote: the real price
   comes with the studio's times. Small and calm, not a button. "Per person"
   because Couples is on the first screen and a couples hour is 100 to 170 EUR. */
.price{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;margin:-6px 0 16px;border-radius:999px;background:rgba(255,255,255,.72);border:1px solid var(--line);font-size:14px;font-weight:500;line-height:1.25;color:var(--ink)}
.price svg{width:15px;height:15px;flex:none;color:var(--clay)}
.price span{text-wrap:balance}

/* Screen 1 says who we are in three lines, instead of a poster and a tap. */
.hero{font-size:clamp(22px,7.1vw,28px);line-height:1.1;margin:2px 0 12px}
.hero + .price{margin-top:0}
.how{font-size:15.5px;margin:-4px 0 14px;text-wrap:balance}
.s1q h2{font-size:clamp(24px,6.6vw,28px);margin:2px 0 12px}
.trust{list-style:none;padding:0;margin:18px 4px 0;display:grid;gap:10px}
.trust li{display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.35;font-weight:500}
.trust svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--clay)}
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:0 6px;margin:18px -8px 0}
.foot a{display:inline-flex;align-items:center;min-height:44px;padding:0 10px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(107,97,87,.45)}

/* Tap targets */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--chip);border-radius:22px;padding:14px 12px;text-align:left;border:2px solid transparent;box-shadow:0 6px 18px rgba(80,40,20,.07);transition:transform .12s,border-color .15s,background .15s}
.tile:active{transform:scale(.97)}
.tile .e{font-size:26px;line-height:1;display:block;margin-bottom:8px}
/* One line per title and per description at 390px in both languages, so
   three rows of tiles fit a short phone screen. "Descontracturante" is one
   long word: slightly smaller in Spanish, with a soft hyphen (Descontrac-turante)
   for phones narrower than 390px. */
.tile b{display:block;font-size:16px;letter-spacing:-.01em;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
:lang(es) .tile b{font-size:15.5px}
.tile small{color:var(--muted);font-size:13px;line-height:1.3;display:block;margin-top:2px}
.tile.sel{border-color:var(--ink);background:#FFFDFB}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:14px;background:var(--chip);border-radius:20px;padding:14px 16px;border:2px solid transparent;text-align:left;box-shadow:0 6px 18px rgba(80,40,20,.07);transition:transform .12s,border-color .15s}
.row:active{transform:scale(.98)}
.row .e{font-size:24px;width:30px;text-align:center}
.row b{font-size:16.5px;display:block}
.row small{color:var(--muted);font-size:13.5px}
.row.sel{border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--chip);border-radius:999px;padding:11px 16px;min-height:44px;font-weight:500;font-size:15px;border:2px solid transparent;box-shadow:0 4px 12px rgba(80,40,20,.06);transition:transform .12s,border-color .15s}
.chip:active{transform:scale(.96)}
.chip.sel{border-color:var(--ink);background:#FFFDFB}
.chip small{color:var(--muted);font-weight:400;margin-left:4px}
.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* Each hour is one card with two halves: the hour on top, half past below. */
.hr{display:flex;flex-direction:column;background:var(--chip);border-radius:20px;overflow:hidden;box-shadow:0 4px 12px rgba(80,40,20,.06)}
.hr button{display:block;width:100%;text-align:center;transition:background .15s,color .15s}
.hr button:active{transform:scale(.96)}
.hr .h0{flex:1;padding:12px 0 8px;font-size:17px;font-weight:700}
.hr .h0 small{display:block;margin-top:2px;font-size:12px;font-weight:500;color:var(--muted)}
.hr .h30{padding:10px 0;font-size:15px;font-weight:600;color:var(--muted);border-top:1px solid var(--line)}
.hr button.sel{background:var(--ink);color:#fff}
.hr button.sel small{color:rgba(255,255,255,.75)}
.label{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.locate{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--ink);color:#fff;border-radius:20px;padding:17px;font-weight:700;font-size:16.5px;margin-bottom:6px}
.locate.done{background:var(--sage);color:var(--ink)}
.note{font-size:13.5px;color:var(--muted);margin-top:8px;min-height:18px}

/* Details. Labels above, the reason under the field, the error under that. */
.field{display:block;margin-bottom:14px}
.field label,.flabel{display:block;font-size:13.5px;font-weight:700;color:rgba(38,32,25,.78);margin:0 0 6px 4px}
.field input,.field textarea{width:100%;background:#fff;border:2px solid transparent;border-radius:16px;padding:15px 16px;font-size:16.5px;outline:none;box-shadow:0 4px 12px rgba(80,40,20,.06)}
.field input:focus,.field textarea:focus{border-color:var(--clay)}
.field input.bad{border-color:var(--bad)}
.field textarea{resize:vertical;min-height:72px;line-height:1.4;font-family:inherit}
.addlink{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin-top:8px;padding:0 4px;font-size:15px;font-weight:700;color:var(--clay-d)}
.count{float:right;font-weight:500;color:var(--muted)}
.help{font-size:13.5px;line-height:1.4;color:var(--muted);margin:6px 4px 0}
.ferr{display:flex;align-items:flex-start;gap:6px;font-size:14px;font-weight:500;line-height:1.35;color:var(--bad);margin:6px 4px 0}
.ferr:empty{display:none}
.ferr svg{width:16px;height:16px;flex:none;margin-top:1px}
.flabel{margin-top:20px}
.tog{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--chip);border-radius:18px;padding:13px 16px;min-height:52px;margin-top:20px;font-size:15.5px;font-weight:500;line-height:1.3;border:2px solid transparent;box-shadow:0 4px 12px rgba(80,40,20,.06)}
.tog .box{width:22px;height:22px;border-radius:7px;border:2px solid rgba(38,32,25,.35);flex:none;display:grid;place-items:center;color:#fff}
.tog .box svg{width:14px;height:14px;opacity:0}
.tog[aria-checked="true"]{border-color:var(--ink);background:#FFFDFB}
.tog[aria-checked="true"] .box{background:var(--ink);border-color:var(--ink)}
.tog[aria-checked="true"] .box svg{opacity:1}

.cta{display:block;width:100%;text-align:center;text-decoration:none;background:var(--clay);color:#fff;border-radius:999px;padding:18px;font-weight:700;font-size:17px;margin-top:18px;box-shadow:0 12px 28px rgba(184,92,56,.35);transition:transform .12s,opacity .2s}
.cta:active{transform:scale(.98)}
.cta[disabled]{opacity:.6;box-shadow:none}
.cta.wa{background:#15803D;box-shadow:0 12px 28px rgba(21,128,61,.30)}
.skip{display:block;width:100%;text-align:center;margin-top:14px;font-weight:700;color:var(--muted);padding:6px}
.consent{font-size:13px;color:var(--muted);line-height:1.45;margin:10px 4px 0}
.err{color:var(--bad);font-size:14px;margin-top:10px;text-align:center}
.err:empty{display:none}

/* The ticket */
.ticket{background:#FFFDFB;border-radius:26px;overflow:hidden;box-shadow:0 24px 60px rgba(80,40,20,.18)}
.ticket .head{background:linear-gradient(150deg,#C96A43,#8E4428);color:#FFF6EE;padding:20px 22px 22px;position:relative;overflow:hidden}
/* The circles stay in the top corner, clear of the (longer) title. */
.ticket .head .o{position:absolute;width:150px;height:150px;border-radius:50%;background:var(--peach);right:-48px;top:-108px;opacity:.85}
.ticket .head .o2{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--sage);right:84px;top:-14px}
.ticket .head h2{position:relative;color:#FFF6EE;font-size:26px;line-height:1.1;margin:8px 0 0;text-wrap:balance}
.perf{height:22px;position:relative;background:radial-gradient(circle at 0 50%,transparent 11px,#FFFDFB 12px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 11px,#FFFDFB 12px) right/51% 100% no-repeat}
.perf:after{content:"";position:absolute;left:22px;right:22px;top:50%;border-top:2px dashed #E4D9CB}
.ticket .body{padding:0 22px 14px}
/* Label and value share a line when they fit, so the WhatsApp button stays
   on the first screen of a phone. */
.kv{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15.5px;line-height:1.4}
.kv:last-child{border:0}
.kv .e{width:24px;flex:none;text-align:center}
.kv small{display:inline-block;margin-right:8px;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.next{background:rgba(255,253,251,.9);border:1px solid rgba(255,255,255,.6);border-radius:22px;padding:16px 18px;margin-top:14px;box-shadow:0 10px 30px rgba(80,40,20,.08)}
.next h3{font-size:16px;font-weight:700;margin-bottom:10px}
.next ol{list-style:none;padding:0;display:grid;gap:9px;counter-reset:s}
.next li{display:flex;gap:12px;font-size:15px;line-height:1.4;counter-increment:s}
.next li:before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;flex:none;margin-top:-1px}
.next li b{font-weight:700}
.mail{display:flex;align-items:center;gap:8px;font-size:15px;margin:14px 4px 0;overflow-wrap:anywhere}
.mail svg{width:18px;height:18px;flex:none;color:var(--clay)}
.fine{text-align:center;color:var(--muted);font-size:13.5px;margin-top:14px;line-height:1.45;text-wrap:balance}

/* "Did you mean ...@gmail.com?" One tap puts it right. */
.typo{font-size:14px;line-height:1.4;margin:6px 4px 0;color:var(--ink)}
.typo:empty{display:none}
.typo button{font-weight:700;color:var(--clay-d);text-decoration:underline;text-underline-offset:3px;padding:10px 2px;margin:-10px 0;overflow-wrap:anywhere}
/* "Other area": a street, a hotel or a town outside the chips. */
.other{display:flex;gap:8px;margin-top:12px}
.other input{flex:1;min-width:0;background:#fff;border:2px solid transparent;border-radius:16px;padding:13px 14px;font-size:16.5px;outline:none;box-shadow:0 4px 12px rgba(80,40,20,.06)}
.other input:focus{border-color:var(--clay)}
.other .cta{width:auto;margin:0;padding:0 20px;min-height:52px}
.privacy{font-size:13px;color:var(--muted);line-height:1.45;margin:12px 4px 0;text-align:center}
.privacy a,.err a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.err a{font-weight:700}
/* Cookie choice: pinned to the bottom, small, and the page is padded by its
   height while it shows, so it never sits on top of a button. */
body{padding-bottom:var(--consent-h,0px)}
.cbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,253,251,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -8px 24px -12px rgba(38,32,25,.18);padding:8px 16px calc(8px + env(safe-area-inset-bottom))}
.cbar div{max-width:480px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.cbar p{flex:1 1 100%;font-size:13.5px;line-height:1.35}
.cbar button{flex:1;min-height:44px;border-radius:999px;border:1.5px solid var(--clay-d);color:var(--clay-d);background:#fff;font-weight:700;font-size:14px}
.cbar a{min-height:44px;display:inline-flex;align-items:center;padding:0 4px;font-size:13px;color:var(--muted);text-decoration:underline}

/* ---------- Desktop (900px and up): a real page, not a phone card ----------
   Desktop fix F10 (2 Nov). Phones and tablets under 900px keep the layout
   above exactly: everything below is either inside a min-width:900px query or
   hidden under 900px. From 900px:
   - the site header and footer (static copies of the React SiteHeader and
     SiteFooter: 64px header, one 1120px container with 20px gutters, so the
     logo, the flow card and the footer share one left edge);
   - no blobs and no glass, the cream page and white cards;
   - two columns: the flow card on the left, a sticky "What happens next"
     card with the price and the trust lines on the right;
   - line icons instead of emoji, buttons sized to their label, hover states;
   - the cookie choice as a 360px card in the bottom-left corner (F20).
   Tokens: design system 3.11. The old names (--ink, --muted, --line, --clay)
   are pointed at the new values from 900px, so the phone rules above pick
   them up there and phones stay as they are. */
:root{
  --bg:#F7F4F0; --card:#FFFFFF; --sand:#EFE7DD; --brand-tint:#FBF1EB;
  --action:#A34A22; --action-hover:#8A3D1A; --action-pressed:#74341A;
  --control:#8F847B; --success:#2F6B3A; --success-tint:#EAF3EC;
  --shadow-card:0 1px 2px rgb(33 28 26/.06),0 4px 16px -6px rgb(33 28 26/.10);
  --shadow-sheet:0 24px 60px -24px rgb(33 28 26/.30);
}
.sh,.sf,.aside,.ic{display:none}
/* .page wraps .app (and the desktop aside). Under 900px it is one screen tall,
   so .app's min-height:100% resolves exactly as it did against <body>. */
.page{height:100%}
@media (min-width:900px){
  :root{
    --cream:#F7F4F0; --ink:#211C1A; --muted:#6B615B; --line:#E5DDD3; --bad:#B03A2E;
    --clay:#A34A22; --clay-d:#A34A22;
    --font:"Outfit","DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  html,body{height:auto}
  body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);font-family:var(--font)}
  .bg{display:none}
  .e{display:none!important}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 20px}
  a{color:inherit}

  /* Site header (copy of src/components/SiteHeader.tsx). */
  .sh{display:block;position:sticky;top:0;z-index:30;flex:none;height:64px;background:var(--bg);border-bottom:1px solid var(--line)}
  .sh .wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px}
  .logo{display:inline-flex;align-items:center;gap:10px;height:44px;padding-right:8px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:17px;line-height:24px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
  /* The avatar loads only here: phones never fetch it. */
  .logo i{width:32px;height:32px;flex:none;border-radius:50%;background:var(--sand) url(/brand/mc-avatar-terracotta-64.webp) center/cover no-repeat}
  .logo span{transition:color .2s}
  .logo:hover span{color:var(--action)}
  .sh nav{display:flex;align-items:center;gap:4px}
  .sh ul{list-style:none;padding:0;display:flex;align-items:center;gap:4px}
  .sh ul a{display:inline-flex;align-items:center;height:44px;padding:0 12px;border-radius:999px;text-decoration:none;font-size:15px;line-height:20px;font-weight:500;color:var(--ink);text-underline-offset:6px;text-decoration-thickness:2px;transition:color .2s}
  .sh ul a:hover{color:var(--action);text-decoration-line:underline}
  .acct{margin-left:8px;display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--control);background:var(--card);color:var(--ink);text-decoration:none;font-size:15px;line-height:20px;font-weight:500;white-space:nowrap;transition:background-color .2s,border-color .2s}
  .acct:hover{background:var(--brand-tint);border-color:var(--action)}
  .langs{margin-left:8px;display:inline-flex;align-items:center;height:40px;padding:3px;gap:2px;border:1px solid var(--line);border-radius:999px;background:var(--card)}

  /* Massage tiles: two columns, a line icon, sized for a pointer. */

  .tile{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);grid-template-areas:"i t" "i d";column-gap:14px;align-content:center;align-items:center;min-height:72px;padding:12px 40px 12px 14px;border-radius:12px;border:1px solid var(--control);box-shadow:none;transition:background-color .2s,border-color .2s,box-shadow .2s}

  .tile.sel{border-color:var(--action);box-shadow:inset 0 0 0 1px var(--action);background:var(--brand-tint)}
  .tile.sel .ic,.tile:hover .ic{background:var(--card)}

  /* Days: two columns of rows. */

  .aside{display:block;position:sticky;top:88px}

  .asteps li:before{content:counter(a);width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}

  .page[data-on="done"] .atrust{padding:0;margin:0;border:0}

  .sf .cols{border-top:1px solid var(--line);padding:48px 0 40px;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:40px}

  .sf ul{list-style:none;padding:0;margin-top:12px;display:grid;gap:4px}
  .sf ul a{display:inline-flex;align-items:center;min-height:32px;font-size:14px;line-height:20px;text-decoration:none;text-underline-offset:4px;transition:color .2s}
  .sf a:hover{color:var(--action);text-decoration-line:underline}
  .sf .legal{border-top:1px solid var(--line);padding:24px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;font-size:13px;line-height:18px;color:var(--muted)}
  .sf .legal ul{display:flex;gap:20px;margin:0}

  /* Hover states for everything you can pick. */
  .tile:hover,.row:hover,.chip:hover,.tog:hover{border-color:var(--action);background:var(--brand-tint)}

  /* Cookie choice: a 360px card in the bottom-left corner, z 50 (F20). The
     page keeps the card's height plus its 16px gap free (setConsentH). */
  .cbar{left:16px;right:auto;bottom:16px;width:360px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:var(--shadow-sheet)}

  .cbar button:hover{background:var(--brand-tint)}
  .cbar a:hover{color:var(--action)}
}
@media (min-width:1024px){
  .page{gap:48px}
  .app{padding:28px 32px 32px}
}

<script>
(() => {
const LEAD = "https://jglftdstrowwckwqmpue.supabase.co/functions/v1/lead";
const q = new URLSearchParams(location.search);

// The hop from "/", "/start" or "/book" (index.html and requestFlowRedirect.ts)
// leaves document.referrer pointing at our own "/". The hop saves the real
// referrer and the path the visitor landed on in sessionStorage ("mc_hop",
// {ref, path, t}). Read once and removed, so a reload is not counted twice.
const HOP = (() => {
  try {
    const v = JSON.parse(sessionStorage.getItem("mc_hop") || "null");
    sessionStorage.removeItem("mc_hop");
    return v && typeof v === "object" && typeof v.path === "string" && Date.now() - Number(v.t || 0) < 120000 ? v : null;
  } catch { return null; }
})();

const intl = (v) => {
  let d = String(v).replace(/[^0-9+]/g, "");
  if (d.startsWith("00")) d = "+" + d.slice(2);
  if (d.startsWith("+")) return "+" + d.slice(1).replace(/\D/g, "");
  return /^[6789]\d{8}$/.test(d) ? "+34" + d : "+" + d;
};
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
// The phone is optional: it counts only once it has a digit in it.
const phoneTyped = () => /\d/.test($("phone").value);
const valid = {
  name: () => !!$("name").value.trim(),
  email: () => EMAIL_RE.test($("email").value.trim()),
  // Without + or 00 only a Spanish number is guessed (612 345 678). Anything
  // else ("5622355063", a US number) needs its country code: guessing "+56"
  // (Chile) would break the WhatsApp hand-off, which matches the exact number.
  phone: () => {
    if (!phoneTyped()) return true;
    const raw = $("phone").value.replace(/[^0-9+]/g, "");
    if (!/^(\+|00)/.test(raw) && !/^[6789]\d{8}$/.test(raw)) return false;
    const n = intl($("phone").value).replace(/\D/g, "").length;
    return n >= 9 && n <= 15;
  },
};

// "ana@gmial.com": email is the only channel for a request with no phone, so a
// typo means studios answer and the customer never hears. KEEP IN SYNC with
// src/lib/emailTypo.ts (its test compares the two maps).
const TYPO = {"gmial.com":"gmail.com","gamil.com":"gmail.com","gmai.com":"gmail.com","gmal.com":"gmail.com","gmaill.com":"gmail.com","gnail.com":"gmail.com","gmail.co":"gmail.com","gmail.con":"gmail.com","gmail.cm":"gmail.com","gmail.om":"gmail.com","hotmial.com":"hotmail.com","hotmal.com":"hotmail.com","hotmai.com":"hotmail.com","hotmil.com":"hotmail.com","hotamil.com":"hotmail.com","hotmail.con":"hotmail.com","hotmail.co":"hotmail.com","outlok.com":"outlook.com","outllok.com":"outlook.com","outlook.con":"outlook.com","yahooo.com":"yahoo.com","yaho.com":"yahoo.com","yahoo.con":"yahoo.com","icloud.con":"icloud.com","iclod.com":"icloud.com","icoud.com":"icloud.com"};
const typoFix = (e) => {
  const v = String(e || "").trim().toLowerCase(); const at = v.lastIndexOf("@");
  if (at < 1) return null;
  const d = v.slice(at + 1);
  const f = TYPO[d] || (/\.(con|cmo|ocm|vom)$/.test(d) ? d.replace(/\.(con|cmo|ocm|vom)$/, ".com") : null);
  return f && f !== d ? v.slice(0, at + 1) + f : null;
};
const typoSeen = new Set();
function showTypo() {
  const fix = typoFix($("email").value);
  // Same hint already showing (in this language): leave it, so a tap on the
  // fix is not lost to the blur that re-renders it.
  const key = fix ? L + "|" + fix : "";
  if ($("emailTypo").dataset.k === key && (!fix || $("typoFix"))) return fix;
  $("emailTypo").dataset.k = key;
  $("emailTypo").innerHTML = fix ? esc(t("typo")).replace("{e}", `<button type="button" id="typoFix">${esc(fix)}</button>`) : "";
  if (fix) $("typoFix").onclick = () => { $("email").value = fix; $("emailTypo").innerHTML = ""; $("emailTypo").dataset.k = ""; setErr("email", false); save(); $("phone").focus(); };
  return fix;
}
$("email").addEventListener("blur", showTypo);
const ERR = { name: "errName", email: "errEmail", phone: "errPhone" };
function setErr(k, bad) {
  $(k).classList.toggle("bad", bad);
  $(k).setAttribute("aria-invalid", String(bad));
  $(k + "Err").innerHTML = bad ? `${ALERT}<span>${esc(t(ERR[k]))}</span>` : "";
}
// Checked on tap, and again when someone leaves a field we marked: never
// while they are still typing.
for (const k of ["name", "email", "phone"]) $(k).addEventListener("blur", () => { if ($(k).classList.contains("bad")) setErr(k, !valid[k]()); save(); });

$("therapist").onclick = (e) => { const b = e.target.closest("[data-v]"); if (b) { S.therapist = b.dataset.v; paint(); } };
$("remind").onclick = () => { S.remind = !S.remind; paint(); };

// The same words the website wizard sends, so studios read one format.
const hm = (hs) => hs.join(" / ");
const slot = (d, hs) => [d ? d.long : "", hs && hs.length ? hm(hs) : ""].filter(Boolean).join(", ");

// The track function keeps the first row per day and event, so the first tap
// is req_submit_attempt and later taps are req_submit_retry (with a count).
let attempts = 0;
$("youForm").onsubmit = async (ev) => {
  ev.preventDefault();
  const btn = $("send");
  if (btn.disabled) return;
  $("sendErr").textContent = "";
  if (blocked) { $("sendErr").textContent = t("blocked"); return; }
  const note = $("note").value.trim().replace(/\s+/g, " ").slice(0, 240);
  if (EROTIC_RE.test(note) || (S.other && EROTIC_RE.test(S.area || ""))) {
    blocked = true;
    track("req_blocked");
    $("sendErr").textContent = t("blocked");
    return;
  }
  const invalid = ["name", "email", "phone"].filter((k) => !valid[k]());
  for (const k of ["name", "email", "phone"]) setErr(k, invalid.includes(k));
  // A likely typo stops the first tap only: tapping Send again sends as typed.
  const em = $("email").value.trim().toLowerCase();
  if (!invalid.includes("email") && showTypo() && !typoSeen.has(em)) { typoSeen.add(em); invalid.push("email_typo"); }
  attempts++;
  track(attempts === 1 ? "req_submit_attempt" : "req_submit_retry", { invalid, n: attempts });
  if (invalid.length) {
    const el = $(invalid[0] === "email_typo" ? "email" : invalid[0]);
    el.focus({ preventScroll: true });
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    return;
  }
  btn.disabled = true; btn.textContent = t("sending");
  const name = $("name").value.trim().replace(/\s+/g, " "), email = $("email").value.trim().toLowerCase();
  // intl("") is "+": an empty field must send no phone at all.
  const phone = phoneTyped() ? intl($("phone").value) : undefined;
  const notes = [
    S.therapist === "female" ? "Prefiere masajista mujer" : S.therapist === "male" ? "Prefiere masajista hombre" : "",
    S.times.length > 1 ? `También le va: ${S.times.slice(1).join(", ")}` : "",
    S.loc ? `Ubicación: ${S.loc.lat.toFixed(5)},${S.loc.lng.toFixed(5)}` : "",
    note ? `Nota del cliente: ${note}` : "",
  ].filter(Boolean).join("; ");
  // The group size goes on `want`, as the old website wizard sent it, so the
  // studio reads it in the ask itself.
  const people = S.people === "3" ? "3+" : S.people;
  const body = {
    want: isGroup() ? `${S.massage} · Personas: ${people}` : S.massage, area: S.area || "Madrid",
    when: slot(S.day, S.times),
    // Structured, so the studio reads "a las 18:00" and is only asked if it is
    // open at that hour (dispatch-studios v16).
    date: S.day && S.day.iso !== "Flexible" ? S.day.iso : undefined,
    time1: S.times.length ? S.times[0].padStart(5, "0") : undefined,
    name, first_name: name.split(" ")[0], phone, email, lang: L, source: "go-page-" + SRC, notes: notes || undefined,
    prefs: {
      service: S.massage, pressure: null, therapist_gender: S.therapist && S.therapist !== "any" ? S.therapist : null,
      every_days: S.remind ? 30 : null, remind_ok: S.remind, day1: S.day && S.day.iso !== "Flexible" ? S.day.iso : null,
      lat: S.loc ? S.loc.lat : null, lng: S.loc ? S.loc.lng : null,
      consent_text: S.remind ? T[L].consent : null,
    },
  };
  try {
    const r = await fetch(LEAD, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || r.status);
    track("req_submit_ok", { request_id: j.id, has_phone: !!phone, gender: S.therapist, massage: S.massage, times: S.times.length, located: !!S.loc, remind: S.remind ? 30 : 0, people: isGroup() ? people : null, has_note: !!note, other_area: S.other, flexible: !!(S.day && S.day.i === 99), attempts });
    forget();
    btn.textContent = t("send"); btn.disabled = false;
    done(j.id, name, phone || "", email);
  } catch (e) {
    track("req_submit_error", { error: String(e && e.message || e).slice(0, 120) });
    $("sendErr").innerHTML = t("sendErr").replace("<a>", `<a href="https://wa.me/${BOT}">`);
    btn.textContent = t("send"); btn.disabled = false;
  }
};

function done(id, name, phone, email) {
  sent = { id, name, phone, email };
  renderDone();
  go("done");
  try { history.replaceState({ mcReq: "done" }, ""); } catch {}
}

// Drawn from `sent`, so the EN|ES toggle redraws it in the other language.
function renderDone() {
  const { id, name, phone, email } = sent;
  const m = MASSAGES.find((x) => x.v === S.massage) || MASSAGES[MASSAGES.length - 1];
  const row = (e, k, v, i) => `<div class="kv"><span class="e" aria-hidden="true">${e}</span>${ic(i)}<div><small>${k}</small>${esc(v)}</div></div>`;
  const anywhere = isAnywhere(S.area);
  const who = THERAPIST[L].find(([v]) => v === S.therapist);
  $("reqNo").textContent = id ? t("req").replace("{n}", id) : "Massage Club";
  $("summary").innerHTML = [
    row(m.e, t("kMassage"), m[L][0], m.i),
    row("🗓️", t("kWhen"), S.day ? [S.day.i === 99 ? t("anyDay") : S.day.title + (S.day.sub ? ", " + S.day.sub : ""), hm(S.times)].filter(Boolean).join(" · ") : "", "calendar"),
    row("📍", t("kWhere"), anywhere ? t("anywhere") : (S.loc ? t("located").replace("{a}", S.area === "Madrid" ? t("you") : S.area) : S.area), "pin"),
    isGroup() ? row("👥", t("kPeople"), (t("peopleOpts").find(([v]) => v === S.people) || [, S.people])[1], "users") : "",
    who && S.therapist !== "any" ? row("👤", t("kWho"), who[1], "user") : "",
    row("💶", t("kPrice"), t(S.massage === "Couples" ? "priceDoneCouples" : "priceDone"), "euro"),
    S.remind ? row("✨", t("kRemind"), t("remindVal"), "bell") : "",
  ].join("");
  const near = S.loc && S.area === "Madrid" ? t("you") : S.area;
  $("steps").innerHTML = [
    anywhere || !S.area ? t("next1Any") : t("next1").replace("{area}", esc(near)),
    phone && id ? t("next2Phone") : t("next2"),
    t("next3"),
  ].map((x) => `<li><span>${x}</span></li>`).join("");
  // The full address, so a typo can still be seen: it is the customer's own
  // screen, seconds after they typed it.
  $("mail").innerHTML = email ? `${MAIL}<span>${esc(t("mail").replace("{m}", email))}</span>` : "";
  // The bot joins this request only by its number plus the same phone, so
  // the button shows only when both exist. "(#id)" must follow "website" or
  // "la web" directly (wa-bot WEB_HANDOFF_RE).
  if (phone && id) {
    const text = t("waText").replace("{name}", name.split(" ")[0]).replace("{want}", m[L][2]).replace("{id}", id);
    $("waSlot").innerHTML = `<a class="cta wa" id="wa" href="https://wa.me/${BOT}?text=${encodeURIComponent(text)}">${esc(t("wa"))}</a>`;
    $("wa").onclick = () => track("wa_handoff", { request_id: id, has_id: true, flow: SRC });
  } else {
    $("waSlot").innerHTML = "";
  }
}

const startAt = restore();
paint();
show(startAt);
// Pageviews. A visitor who landed on "/" or "/start" and hopped here gets the
// pageview the React page used to send for that path, with the real referrer,
// so the weekly path-based numbers still see home traffic. Then /reserve.
if (HOP && PATH_SRC[HOP.path]) send({ path: HOP.path, ref: REF || null });
send({ path: location.pathname, ref: REF || null });
{
  const utm = {};
  for (const k of ["utm_source", "utm_medium", "utm_campaign", "utm_content", "fbclid", "gclid"]) { const v = q.get(k); if (v) utm[k] = k.endsWith("clid") ? "1" : v.slice(0, 80); }
  const nav = String(navigator.language || "").toLowerCase().slice(0, 8) || null;
  track("req_view", { src: SRC, ref: refHost(REF), entry: HOP ? HOP.path : null, navlang: nav, restored: startAt > 0, ...utm });
  // Campaign attribution, as the website's logCampaignVisit (src/lib/siteVisit.ts).
  if (q.get("utm_source") || q.has("gclid")) {
    send({ event: "campaign_visit", path: HOP && PATH_SRC[HOP.path] ? HOP.path : location.pathname, slug: null, partner_slug: null, meta: {
      lang: L, host: location.hostname, v: "ds1", source: q.get("utm_source") || "gclid", medium: q.get("utm_medium"), campaign: q.get("utm_campaign"),
      term: q.get("utm_term"), content: q.get("utm_content"), gclid: q.has("gclid"),
    } });
  }
}
// Tags after the page is up, never in the way of the first screen.
const later = () => setTimeout(() => { loadGtag(); loadClarity(); }, 1200);
if (document.readyState === "complete") later(); else window.addEventListener("load", later, { once: true });
})();
</script>
