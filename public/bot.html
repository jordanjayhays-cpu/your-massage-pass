<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Massage Club</title>
<style>body{margin:0;background:#F1EBE2;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#262019}#mc-loading{text-align:center;margin-top:40vh;color:#8A7F73;font-size:14px}</style>
</head>
<body>
<p id="mc-loading">Loading…</p>
<script>
// Founder reply pages (reply as the bot, conversations). Supabase shows HTML
// from its own domain as plain text, so this shell lives on massageclub.io and
// fetches the rendered page from the wa-bot function as JSON. Nothing secret
// is here: every link carries its own signature, checked on the server.
(function () {
  var API = "https://jglftdstrowwckwqmpue.supabase.co/functions/v1/wa-bot";
  var styled = false;

  function apiUrl() { return API + location.search + (location.search ? "&" : "?") + "fmt=json"; }

  function render(html) {
    var doc = new DOMParser().parseFromString(html, "text/html");
    document.title = doc.title || "Massage Club";
    if (!styled) {
      doc.querySelectorAll("style").forEach(function (s) { document.head.appendChild(s.cloneNode(true)); });
      styled = true;
    }
    document.body.innerHTML = "";
    Array.prototype.forEach.call(doc.body.childNodes, function (n) {
      if (n.nodeName !== "SCRIPT") document.body.appendChild(document.importNode(n, true));
    });
    // Same page is also served on *.vercel.app for networks that block
    // massageclub.io; keep in-page links on whichever host was opened.
    document.querySelectorAll("a[href^='https://book.massageclub.io/bot.html']").forEach(function (a) {
      a.setAttribute("href", a.getAttribute("href").replace("https://book.massageclub.io/bot.html", location.origin + location.pathname));
    });
    wire();
    window.scrollTo(0, document.body.scrollHeight);
  }

  function call(opts) {
    return fetch(apiUrl(), opts)
      .then(function (r) { return r.json(); })
      .then(function (j) { render(j.html || "<p style='padding:20px'>Could not load this page.</p>"); })
      .catch(function () {
        render("<p style='padding:20px;text-align:center;color:#9A3B1E'>Could not reach the bot. Check your connection and reload.</p>");
      });
  }

  // Live translation for the side-by-side composer. Sends nothing.
  function translate(text, to) {
    var body = new URLSearchParams();
    body.set("mode", "translate"); body.set("text", text); body.set("to", to);
    return fetch(apiUrl(), { method: "POST", body: body })
      .then(function (r) { return r.json(); })
      .then(function (j) { return j.out || ""; })
      .catch(function () { return null; });
  }

  function wire() {
    var src = document.getElementById("src");   // English, what Jordan types
    var dst = document.getElementById("t");     // Spanish, editable
    var form = document.querySelector("form.compose");
    var timer = null, seq = 0;

    function sendLang() {
      var r = document.querySelector("input[name=lang]:checked");
      return r ? r.value : "es";
    }

    if (src && dst) {
      // Type English, the Spanish fills in on the right.
      src.addEventListener("input", function () {
        clearTimeout(timer);
        var mine = ++seq;
        timer = setTimeout(function () {
          var t = src.value.trim();
          if (!t) { dst.value = ""; return; }
          dst.classList.add("busy");
          translate(t, "es").then(function (out) {
            if (mine !== seq) return;
            dst.classList.remove("busy");
            if (out !== null) dst.value = out;
          });
        }, 650);
      });
      // A Spanish draft already on the right gets its English on the left.
      if (dst.value.trim() && !src.value.trim()) {
        src.classList.add("busy");
        translate(dst.value.trim(), "en").then(function (out) {
          src.classList.remove("busy");
          if (out && !src.value.trim()) src.value = out;
        });
      }
    }

    document.querySelectorAll(".chip").forEach(function (b) {
      b.addEventListener("click", function () {
        var text = b.getAttribute("data-t");
        if (b.getAttribute("data-l") === "es" && dst) {
          dst.value = text;
          if (src) {
            src.value = "";
            src.classList.add("busy");
            translate(text, "en").then(function (out) { src.classList.remove("busy"); if (out) src.value = out; });
          }
          dst.focus();
        } else if (src) {
          src.value = text;
          src.dispatchEvent(new Event("input"));
          src.focus();
        }
      });
    });

    if (!form) return;
    // Closed 24h window: the bot number cannot send free text, but Jordan's own
    // WhatsApp Business app can. Hand him the chosen box in his WhatsApp.
    var phone = new URLSearchParams(location.search).get("reply");
    var sendBtn = form.querySelector(".send");
    if (phone && sendBtn && sendBtn.disabled && document.querySelector(".pill.warn")) {
      [src, dst].forEach(function (b) { if (b) b.disabled = false; });
      document.querySelectorAll("input[name=lang]").forEach(function (r) { r.disabled = false; });
      var wa = document.createElement("a");
      wa.className = "send"; wa.target = "_blank"; wa.rel = "noopener";
      wa.textContent = "Open in my WhatsApp";
      wa.style.cssText = "text-decoration:none;display:inline-flex;align-items:center;width:auto;padding:0 16px";
      wa.addEventListener("click", function () {
        var box = sendLang() === "en" ? src : dst;
        wa.href = "https://wa.me/" + phone.replace(/\D/g, "") + "?text=" + encodeURIComponent((box && box.value || "").trim());
      });
      sendBtn.replaceWith(wa);
      var hint = form.querySelector(".hint");
      if (hint) hint.textContent = "The 24 hour window is closed, so the bot number cannot send this. The button opens it in your own WhatsApp (+34 612 474 827), which has no 24 hour limit.";
    }
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var box = sendLang() === "en" ? src : dst;
      var text = (box && box.value || "").trim();
      if (!text) { if (box) box.focus(); return; }
      var btn = form.querySelector(".send");
      if (btn) { btn.disabled = true; btn.textContent = "Sending"; }
      var body = new URLSearchParams();
      body.set("text", text);
      body.set("raw", "1");   // exactly what is in the chosen box, no re-translation
      call({ method: "POST", body: body });
    });
  }

  call();
})();
</script>
</body>
</html>
