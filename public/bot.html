<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Massage Club</title>
<style>body{margin:0;background:#F1EBE2;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#262019}#mc-loading{text-align:center;margin-top:40vh;color:#8A7F73;font-size:14px}</style>
</head>
<body>
<p id="mc-loading">Loading…</p>
<script>
// Founder reply pages (reply as the bot, inbox). Supabase shows HTML from its
// own domain as plain text, so this shell lives on massageclub.io and fetches
// the rendered page from the wa-bot function as JSON. Nothing secret is here:
// every link carries its own signature, checked on the server.
(function () {
  var API = "https://jglftdstrowwckwqmpue.supabase.co/functions/v1/wa-bot";
  var styled = false;

  function render(html) {
    var doc = new DOMParser().parseFromString(html, "text/html");
    document.title = doc.title || "Massage Club";
    if (!styled) {
      doc.querySelectorAll("style").forEach(function (s) { document.head.appendChild(s.cloneNode(true)); });
      styled = true;
    }
    document.body.innerHTML = "";
    Array.prototype.forEach.call(doc.body.childNodes, function (n) {
      if (n.nodeName !== "SCRIPT") document.body.appendChild(document.importNode(n, true));
    });
    wire();
    window.scrollTo(0, document.body.scrollHeight);
  }

  function call(opts) {
    var q = location.search + (location.search ? "&" : "?") + "fmt=json";
    return fetch(API + q, opts)
      .then(function (r) { return r.json(); })
      .then(function (j) { render(j.html || "<p style='padding:20px'>Could not load this page.</p>"); })
      .catch(function () {
        render("<p style='padding:20px;text-align:center;color:#9A3B1E'>Could not reach the bot. Check your connection and reload.</p>");
      });
  }

  function wire() {
    var box = document.getElementById("t");
    document.querySelectorAll(".chip").forEach(function (b) {
      b.addEventListener("click", function () {
        if (!box) return;
        box.value = b.getAttribute("data-t");
        box.focus();
      });
    });
    var form = document.querySelector("form.compose");
    if (!form) return;
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var text = (box && box.value || "").trim();
      if (!text) return;
      var btn = form.querySelector(".send");
      if (btn) { btn.disabled = true; btn.textContent = "Sending"; }
      var body = new URLSearchParams();
      body.set("text", text);
      call({ method: "POST", body: body });
    });
  }

  call();
})();
</script>
</body>
</html>
