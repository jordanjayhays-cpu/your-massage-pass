    <!-- One front door: "/", "/start", "/book" and "/booking" open the request
         flow at /reserve (public/go.html) before the 2 MB bundle loads.
         KEEP IN SYNC with requestFlowTarget() in src/lib/requestFlowRedirect.ts,
         which applies the same rules to client-side navigations. ES5 only. -->
    <script>
      (function () {
        try {
          var l = window.location;
          var p = l.pathname.replace(/\/+$/, '') || '/';
          var map = { '/': 'home', '/start': 'start', '/book': 'book', '/booking': 'book' };
          var mapped = Object.prototype.hasOwnProperty.call(map, p) ? map[p] : null;
          if (!mapped) return;
          if (l.hostname.indexOf('lovable') !== -1) return;
          // Only the booking host and local previews: on any other host "/"
          // is the marketing Home (App.tsx).
          if (l.hostname.indexOf('book.') !== 0 && l.hostname !== 'localhost' && l.hostname !== '127.0.0.1') return;
          var q = new URLSearchParams(l.search);
          if (q.get('stay') === '1') return;
          if (p === '/') {
            // Supabase sign-in links land on "/": leave them to Login.
            if (/access_token|refresh_token|error_description|type=(signup|magiclink|recovery|invite)/.test(l.hash)) return;
            if (q.has('code') || q.has('token') || q.has('token_hash') || q.has('error')) return;
            // A signed-in visitor keeps Login, which forwards them on.
            for (var i = 0; i < localStorage.length; i++) {
              if (/^sb-.*-auth-token$/.test(localStorage.key(i) || '')) return;
            }
          }
          // A valid src wins ("IG" and "ig_bio" count as "ig" and "ig-bio");
          // a missing or invalid one becomes where the visitor landed.
          var s = (q.get('src') || '').toLowerCase().replace(/_/g, '-');
          if (!/^[a-z0-9-]{1,20}$/.test(s)) s = (q.get('gclid') || q.get('gbraid') || q.get('wbraid')) ? 'google' : mapped;
          q.set('src', s);
          // After the hop document.referrer is our own "/", so the real one
          // and the landing path travel in sessionStorage (go.html reads and
          // removes "mc_hop"). Blocked storage only loses the referrer.
          try {
            sessionStorage.setItem('mc_hop', JSON.stringify({ ref: String(document.referrer || '').slice(0, 300), path: p, t: new Date().getTime() }));
          } catch (e) { /* keep going */ }
          l.replace('/reserve?' + q.toString());
        } catch (e) { /* fall through to the React page */ }
      })();
    </script>

    <!-- Google Consent Mode v2: denied defaults MUST run before the gtag script -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });

      // Honour the personal analytics opt-out (?nt=1 → localStorage "mc_nt"):
      // when set, the Google tag is never loaded at all.
      (function () {
        try {
          var p = new URLSearchParams(window.location.search).get('nt');
          if (p === '1') localStorage.setItem('mc_nt', '1');
          else if (p === '0') localStorage.removeItem('mc_nt');
          if (localStorage.getItem('mc_nt') === '1') return;
        } catch (e) { /* ignore */ }

        // Re-apply a previously granted consent choice before the tag loads.
        try {
          if (localStorage.getItem('mc_consent') === 'granted') {
            gtag('consent', 'update', {
              ad_storage: 'granted',
              ad_user_data: 'granted',
              ad_personalization: 'granted',
              analytics_storage: 'granted'
            });
          }
        } catch (e) { /* ignore */ }

        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18401185487';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'AW-18401185487');
      })();
